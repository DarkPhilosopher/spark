<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spark 3D</title>
<style>
  :root{
    /* Gray + light blue, on purpose -- no near-black background, no neon
       accent. See ~/spark/CLAUDE.md "design preference". */
    --bg:#4a5058; --panel:#5b6169; --panel2:#666d76; --line:#838a94;
    --ink:#f2f4f6; --dim:#c7ccd3; --accent:#8ecae6; --bad:#d99a94;
    --good:#a8c9a0;
    /* How big each pad is, as a share of this phone's own screen -- so it
       comes out right on a small phone and a big one without either being
       measured. There are two pads side by side now (move + actions, see
       .pad below), so this is under half of what a single combined pad
       used to claim, not the old 94vw -- 40% of the width leaves genuine
       room between the two thumb zones instead of them nearly touching in
       the middle. Sideways this is overridden below. The cap stops a
       tablet handing either one the size of a dinner plate. */
    --pad:min(40vw, 46vh, 230px);
    --util:clamp(36px, 9vw, 48px); /* restart / centre / save / live: pressed rarely */
    /* The translucent panel colours that kept getting retyped as the same
       literal rgba() across pad/side/drawer/modals as each was added --
       named once here instead. Not every rgba() in this file uses these:
       only the ones that were genuinely the same value more than once. */
    --glass-input: rgba(102,109,118,.5);   /* text/number inputs inside a modal */
    --glass-btn: rgba(102,109,118,.6);     /* pad/side/tab/bubble backgrounds */
    --overlay-text: rgba(74,80,88,.85);    /* HUD/say floating text backgrounds */
    --modal-bg: rgba(74,80,88,.96);        /* Mesh Creator / Build / Inspector backgrounds */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
       font:15px/1.4 system-ui,-apple-system,"Roboto",sans-serif;
       -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
       touch-action:none;
       height:100vh;height:100dvh}   /* dvh: Chrome's address bar comes and goes */

  /* The world always fills the whole device screen -- the bar and the pad
     float over it as translucent panels instead of splitting the page into
     a game region and a controls region, so nothing ever crops the view
     down to a smaller window than the screen actually is. */
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
         touch-action:none}

  /* the glyphs, floated over their cubes */
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .glyph{position:absolute;transform:translate(-50%,-50%);
         font:700 15px/1 ui-monospace,monospace;
         text-shadow:0 1px 3px #000,0 0 6px #000;white-space:pre}

  /* Ring around whichever object the Inspector currently has -- tap any
     object in the world to pick it (see setupObjectPicking()), or it
     follows whatever the touch-based inspect found. Projected the same
     way a glyph is, so it tracks the object exactly as the camera moves. */
  #select-highlight{position:absolute;top:0;left:0;width:46px;height:46px;
      margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;
      border:3px solid var(--accent);box-shadow:0 0 12px var(--accent);
      display:none}
  #select-highlight.on{display:block}

  /* One of these per object queued for 🧬 merge (see mergeSelection) --
     a pool of plain divs rather than one fixed element, since there can be
     any number of them. Good, not accent, so a merge-in-progress reads as
     visibly different from the single Inspector selection ring above. */
  .merge-highlight{position:absolute;top:0;left:0;width:40px;height:40px;
      margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;
      border:3px solid var(--good);box-shadow:0 0 10px var(--good)}

  /* top bar: the name and badge, then the buttons you press rarely */
  #bar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;
       flex-direction:column;gap:6px;padding:8px;
       padding-top:calc(8px + env(safe-area-inset-top));
       background:linear-gradient(rgba(74,80,88,.95),rgba(74,80,88,0));
       pointer-events:none}
  #bar button,#bar .badge{pointer-events:auto}
  .barrow{display:flex;gap:8px;align-items:center}
  #title{font-weight:700;font-size:15px;margin-right:auto;
         text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
  .badge{font:700 11px/1 ui-monospace,monospace;letter-spacing:.1em;
         border-radius:20px;padding:8px 12px;border:1px solid var(--line);
         background:var(--panel);white-space:nowrap}
  .badge.live{color:var(--good);border-color:var(--good)}
  .badge.local{color:var(--accent);border-color:var(--accent)}
  /* Icons for the buttons pressed rarely (restart/recentre/fullscreen),
     short words for the ones whose meaning an icon would blur (save/new) or
     that already carry their own dynamic label (mode) -- kept small and
     wrapping instead of running off the edge of a narrow phone. */
  #side,#side-tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  #side-tools{margin-top:6px}
  #side button,#side-tools button{font-size:12px;padding:8px 12px;border-radius:11px;
               min-height:var(--util);min-width:0;
               background:var(--glass-btn);backdrop-filter:blur(6px);
               -webkit-backdrop-filter:blur(6px)}

  /* 160px, not the 104px this used to be -- the top bar grew a second
     row of buttons (#side-tools) and this has to clear both rows plus
     the title, on the shortest phone this runs on, not just a tall one. */
  #hud{position:absolute;top:calc(160px + env(safe-area-inset-top));left:8px;z-index:4;
       font:12px/1.7 ui-monospace,monospace;color:var(--dim);
       background:var(--overlay-text);border-radius:10px;padding:6px 10px}
  #hud b{color:var(--ink)}
  #say{position:absolute;top:calc(160px + env(safe-area-inset-top));right:8px;z-index:4;
       max-width:52vw;text-align:right;color:var(--accent);font-size:13px;
       background:var(--overlay-text);border-radius:10px;padding:6px 10px}
  #say:empty{display:none}

  /* Floats over the bottom of the world instead of claiming a strip of the
     page for itself -- pointer-events:none on the wrapper so a swipe in the
     empty middle between the two pads still reaches the canvas and turns
     the camera; the pads and their buttons opt back in below.
     space-between (not centered) is the point of the split: one pad sits
     at the left edge, the other at the right, so each lands under whichever
     thumb is already resting near that side of the phone instead of both
     controls sharing one block you have to reach into the middle for. */
  #controls{position:fixed;left:0;right:0;bottom:0;z-index:4;
            display:flex;align-items:flex-end;justify-content:space-between;
            padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
            pointer-events:none}
  button{font:inherit;color:var(--ink);background:var(--panel2);
         border:1px solid var(--line);border-radius:14px;
         min-height:48px;min-width:48px;padding:10px 14px}
  button:active{filter:brightness(1.45)}
  button[disabled]{opacity:.4}

  /* Two thumb-zone pads instead of one combined block (see #controls above):
     #pad-move (bottom-left) is just the four arrows in a plus, #pad-actions
     (bottom-right) is the fire/utility buttons that used to sit in the
     corners and centre of the old single pad -- same keys, same relative
     positions, just carried by a grid of their own. Both are still a square
     of side --pad, three cells by three (grid-template-areas below leaves
     the unused cells empty rather than dropping to fewer columns, so a
     button is never smaller, or the pad never narrower, than the old
     combined one's per-key size was). Half transparent and blurred, so
     each reads as floating over the environment rather than a solid panel
     sitting beside it. */
  .pad{display:grid;width:var(--pad);height:var(--pad);
       grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
       gap:3%;pointer-events:auto}
  .pad button{width:100%;height:100%;min-width:0;min-height:0;padding:0;
              border-radius:18%;font-size:calc(var(--pad) * 0.115);
              background:rgba(102,109,118,.55);border-color:rgba(131,138,148,.6);
              backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .pad .fire{background:rgba(126,164,186,.4);border-color:var(--accent);color:var(--accent);
             font-size:calc(var(--pad) * 0.09)}
  #pad-move{grid-template-areas:".    up    ."
                                 "left .     right"
                                 ".    down  ."}
  #pad-move button[data-key="up"]{grid-area:up}
  #pad-move button[data-key="left"]{grid-area:left}
  #pad-move button[data-key="right"]{grid-area:right}
  #pad-move button[data-key="down"]{grid-area:down}
  #pad-actions{grid-template-areas:"e . f"
                                    ". space ."
                                    "s . w"}
  #pad-actions button[data-key="e"]{grid-area:e}
  #pad-actions button[data-key="f"]{grid-area:f}
  #pad-actions button[data-key="space"]{grid-area:space}
  #pad-actions button[data-key="s"]{grid-area:s}
  #pad-actions button[data-key="w"]{grid-area:w}

  /* Upright there are two of these side by side, so each gets less than
     the old single pad's full share of the screen -- 40vw not 94vw --
     while the 46vh floor and 230px cap stop it shrinking or growing past
     a sensible thumb-zone size regardless of screen shape. Sideways there
     is width to spare and no height to spare, so both pads shrink to a
     landscape-appropriate size (same 46vw share the single pad used to
     use, since now two share the width instead of one taking it all) and
     the row's own height cap keeps neither one tall enough to reach up
     into the top bar. Either way #controls above still puts one at each
     bottom corner; only the size formula changes here. */
  @media (orientation:landscape){
    /* 100vh minus room for the top bar (title + a row of side buttons)
       and the bottom safe area, so a pad can no longer grow tall enough
       to reach up and overlap the bar the way a flat vh share could. */
    :root{--pad:min(46vw, calc(100vh - 150px), 230px)}
    #controls{padding-right:calc(8px + env(safe-area-inset-right))}
  }

  /* Button Drawer: a row of round buttons that slides out from the left
     edge, floating translucent over the world -- see makeDrawer() below
     and ~/bubble-drawer/README.md for the full write-up. */
  .drawer{position:fixed;z-index:6;display:flex;
          transition:transform .25s cubic-bezier(.2,.8,.3,1)}
  /* A fixed offset from the top, not vertically centered or bottom-anchored
     -- centered put it right over the HUD on a short landscape screen, and
     the portrait pad can span nearly the full width of the bottom half, so
     "low-left" isn't actually clear of it either. This band -- below the
     HUD, above where a portrait pad's top edge lands -- is clear in both
     orientations (landscape keeps the whole left half free of the pad,
     which sits on the right there, regardless of height). */
  .drawer[data-edge="left"]{top:calc(250px + env(safe-area-inset-top));left:0;
                             flex-direction:row;
                             transform:translate(calc(-100% + var(--util)), 0)}
  .drawer[data-edge="left"].open{transform:translate(0, 0)}
  .drawer .tab{width:var(--util);height:var(--util);flex:0 0 auto;
               display:flex;align-items:center;justify-content:center;
               background:var(--glass-btn);border:1px solid var(--line);
               color:var(--accent);font-size:20px;cursor:pointer;
               backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
               border-radius:0 14px 14px 0}
  .drawer .tab span{transition:transform .25s;display:block}
  .drawer.open .tab span{transform:rotate(180deg)}
  /* flex-direction:column *and* flex-wrap:wrap: a plain vertical list has
     no limit on how tall it gets, so a handful of custom bubbles (added
     with the + control) used to push the bottom ones -- often literally
     the +/x controls themselves -- past the bottom edge of the screen
     with no way to reach them, no scrollbar, nothing. Capping the height
     (below, since the cap needs this edge's own top offset) makes the
     column wrap sideways into a second, third, ... column instead of
     running off the bottom -- flex-wrap moves a whole bubble to the next
     column rather than ever slicing one in half, so nothing renders
     partially cut off either. */
  .drawer .bubbles{display:flex;flex-direction:column;flex-wrap:wrap;
                   gap:10px;padding:10px;
                   background:rgba(74,80,88,.55);border:1px solid var(--line);
                   backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  /* The cap itself: from this edge's own top offset (250px + the safe
     area, same as .drawer[data-edge="left"] below) down to the bottom of
     the screen, minus a little breathing room. overflow-x:auto is a
     fallback for a pathological number of custom bubbles that would need
     more columns than even the widest phone has room for -- scrolls
     sideways rather than running off the *right* edge instead of the
     bottom. max-width stops the drawer, opened, from ever claiming more
     than the screen actually has. */
  .drawer[data-edge="left"] .bubbles{
      max-height:calc(100vh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px);
      max-height:calc(100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px);
      max-width:calc(100vw - var(--util) - 20px);
      overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
  .bubble{width:var(--util);height:var(--util);border-radius:50%;flex:0 0 auto;
          display:flex;align-items:center;justify-content:center;
          background:var(--glass-btn);border:1px solid var(--line);
          color:var(--ink);font-size:18px;cursor:pointer;
          transition:transform .12s,background .12s}
  .bubble:active{transform:scale(.88)}
  .bubble.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .bubble.control{margin-top:6px;font-weight:700}
  .bubble.control.add{color:var(--good);border-color:var(--good)}
  .bubble.control.remove{color:var(--bad);border-color:var(--bad)}
  /* armed: waiting for you to tap the bubble to remove, not acting yet */
  .bubble.control.remove.armed{background:var(--bad);color:var(--bg);
                                animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  /* a locked bubble refusing a removal tap: a short shake, nothing removed */
  .bubble.shake{animation:shake .32s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
  }

  /* Button editor: on while body has .editing-buttons. Every button this
     applies to is marked [data-editable] -- every pad and side-bar button
     up front, and every button drawer's bubbles too (including its own
     +/× and any you add), registered as each one is built. A selected one
     gets a solid outline instead of dashed and the panel shows its
     sliders; position/size/opacity are stored per-button, by a stable id,
     in localStorage, so they survive a reload. */
  body.editing-buttons [data-editable]{outline:2px dashed var(--accent);
                                        outline-offset:3px;cursor:grab;
                                        touch-action:none}
  body.editing-buttons [data-editable].edit-selected{outline-style:solid}
  /* Near-fullscreen, same "inset from every edge, not edge to edge" idea
     as Properties -- it was a small bottom-anchored box before, which is
     how it ended up overflowing off the top of a short screen; a fixed
     inset can't do that, and there's room for everything to breathe. */
  #edit-panel{position:fixed;inset:6vh 6vw;z-index:20;display:none;
              flex-direction:column;gap:8px;overflow-y:auto;touch-action:pan-y;
              background:rgba(74,80,88,.94);border:1px solid var(--line);
              border-radius:12px;padding:14px 16px;
              backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #edit-panel.on{display:flex}
  #edit-panel label{display:flex;align-items:center;gap:8px;
                     font-size:12px;color:var(--dim)}
  #edit-panel input[type=range]{flex:1}
  #edit-panel input[type=number]{flex:1;width:100%;min-width:0;font:inherit;
                                 color:var(--ink);background:var(--glass-input);
                                 border:1px solid var(--line);border-radius:6px;
                                 padding:6px 8px;min-height:32px}
  #edit-panel .row{display:flex;flex-wrap:wrap;gap:8px}
  #edit-panel button{flex:1;font-size:12px;padding:6px 10px;min-height:36px}
  #edit-panel input[type=checkbox]{width:18px;height:18px;flex:0 0 auto}
  /* faint lines across the whole screen at the grid spacing, so grid lock
     has something to actually align to, not just invisible snapping.
     background-size in % is relative to this element's own box, which is
     the full viewport (position:fixed;inset:0) -- so it always matches
     the grid size percent with no JS recalculation on resize. */
  #edit-grid-overlay{position:fixed;inset:0;z-index:5;display:none;
                     pointer-events:none;
                     background-image:
                       linear-gradient(to right, rgba(142,202,230,.4) 1px, transparent 1px),
                       linear-gradient(to bottom, rgba(142,202,230,.4) 1px, transparent 1px);
                     background-size:5% 5%}
  #edit-grid-overlay.on{display:block}
  /* every button that exists, so one that got dragged off-screen or faded
     down to invisible can still be found and picked, by name */
  /* Exactly 4 rows tall (4 * 34px row + 3 * 4px gap), then scrolls for the
     rest -- a fixed pixel height rather than a vh share, so it is really
     four rows on every screen instead of "however many happen to fit".
     min-height:0 matters here: without it a flex child (which this is,
     #edit-panel is display:flex) refuses to shrink below its content's
     natural height no matter what max-height says, so the whole list
     would render at full height regardless of what max-height/overflow
     said -- exactly what "overflow-y:auto" was supposed to prevent. */
  #edit-list{display:flex;flex-direction:column;gap:4px;
             max-height:148px;min-height:0;overflow-y:auto;touch-action:pan-y}
  .edit-list-row{box-sizing:border-box;height:34px;flex:0 0 auto;
                 display:flex;align-items:center;
                 font-size:12px;padding:0 10px;border-radius:8px;
                 background:var(--glass-input);cursor:pointer;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edit-list-row.on{background:var(--accent);color:var(--bg);font-weight:700}
  /* named layout saves -- same row look, plus a delete glyph on the right */
  #edit-layout-list{display:flex;flex-direction:column;gap:4px;
                    max-height:148px;min-height:0;overflow-y:auto;touch-action:pan-y}
  .layout-row{display:flex;align-items:center;justify-content:space-between;
             cursor:default}
  .layout-name{flex:1;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .layout-del{color:var(--bad);font-weight:700;padding:2px 8px;cursor:pointer}

  /* All five modals (Backpack, Properties, Mesh Creator, Build/palette,
     Object Inspector) share one shell and one internal formation now: a
     titlebar, then up to six large buttons filling most of the screen
     with a box off to the side for whatever that page's buttons don't
     cover -- live readouts, a search/typed field, a preview canvas, a
     part list -- the same "six panel buttons besides a box" shape the
     browser editor's own deck uses (see README's "How it sits on the
     screen"), reused here rather than each modal inventing its own.
     Backpack used to be a deliberate Windows-Explorer-styled exception
     (see CHANGELOG); folded into the same shell and theme on request. */
  #backpack-modal,#properties-modal,#mesh-modal,#palette-modal,#inspect-modal{
      position:fixed;inset:6vh 6vw;z-index:17;display:none;flex-direction:column;
      background:var(--modal-bg);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35);
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #backpack-modal.on,#properties-modal.on,#mesh-modal.on,#palette-modal.on,
  #inspect-modal.on{display:flex}
  .modal-titlebar{display:flex;align-items:center;gap:8px;padding:12px 14px;
                  font-weight:700;border-bottom:1px solid var(--line);flex:0 0 auto}
  .modal-titlebar span{margin-right:auto;overflow:hidden;text-overflow:ellipsis;
                       white-space:nowrap}
  .modal-titlebar button{min-height:34px;padding:4px 12px}
  .modal-titlebar button.danger{color:#ff9a94;border-color:var(--bad)}
  /* Hidden by default -- shown only on a modal's own sub-page (see
     showModalPage below), same job as index.html's own #backkey: pop one
     level back up rather than closing the whole modal. */
  .modal-back{display:none}
  .modal-back.showing{display:inline-block}

  /* The formation itself. Portrait: two columns of buttons on top, the
     box spanning the full width underneath -- landscape: three columns of
     buttons on the left, the box a full-height column on the right. Same
     4x2-cells-of-8, six-for-buttons-two-for-the-box ratio as index.html's
     own #deck/#keys, just re-expressed here since world3d.html is a
     separate file with nothing to import it from. */
  .mgrid{flex:1 1 auto;display:grid;gap:8px;padding:10px;min-height:0;
        grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr)}
  .mkeys{grid-column:1/-1;grid-row:1/4;display:grid;gap:8px;min-height:0;
        grid-template-columns:1fr 1fr;grid-auto-rows:minmax(44px,1fr);
        overflow-y:auto;touch-action:pan-y}
  .mbox{grid-column:1/-1;grid-row:4/5;min-height:0;overflow-y:auto;touch-action:pan-y;
       background:var(--glass-input);border:1px solid var(--line);
       border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
  @media (orientation:landscape){
    .mgrid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
    .mkeys{grid-column:1/4;grid-row:1/-1;grid-template-columns:repeat(3,1fr)}
    .mbox{grid-column:4/5;grid-row:1/-1}
  }
  /* One button per cell, sized to the cell rather than its own text --
     the same "largest that fits" idea as #pad/.pad above, just square
     corners and a label instead of a glyph. */
  .mkey{width:100%;height:100%;min-height:44px;padding:6px;
       font-size:clamp(11px,3.4vmin,15px);line-height:1.25;white-space:normal;
       background:var(--glass-btn);border-color:var(--line)}
  .mkey small{display:block;font-size:.72em;font-weight:400;color:var(--dim);
             margin-top:2px}
  .mkey.on{border-color:var(--accent);color:var(--accent);
          box-shadow:0 0 0 1px var(--accent) inset}
  .mkey.danger{border-color:var(--bad);color:#ff9a94}
  .mkey.empty{cursor:default;color:var(--dim);font-size:12px}

  /* the box's own contents -- same look wherever it shows up */
  .mbox .prop-row{display:flex;align-items:center;justify-content:space-between;
       gap:12px;padding:6px 2px;border-bottom:1px solid rgba(131,138,148,.35)}
  .mbox .prop-label{font-size:13px;color:var(--dim)}
  .mbox .prop-value{font:14px/1 ui-monospace,monospace;color:var(--ink)}
  .mbox input[type=number],.mbox input[type=text],.mbox select{
      width:100%;min-width:0;font:inherit;color:var(--ink);
      background:var(--glass-input);border:1px solid var(--line);
      border-radius:6px;padding:6px 8px;min-height:32px}
  .mbox input[type=range]{width:100%}

  /* Backpack's file grid and breadcrumb, now living in the box instead of
     the whole modal -- same icons-and-labels idea, recoloured for the
     game's own theme instead of the old white Explorer chrome. */
  #backpack-path{font-size:12px;color:var(--dim)}
  .bp-crumb{cursor:pointer;color:var(--accent)}
  .bp-crumb:last-child{color:var(--dim);cursor:default}
  #backpack-grid{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
                 display:grid;grid-template-columns:repeat(auto-fill,66px);
                 gap:6px;align-content:start}
  .bp-item{display:flex;flex-direction:column;align-items:center;gap:4px;
           padding:6px 4px;border-radius:6px;cursor:pointer;text-align:center}
  .bp-item.on{background:rgba(142,202,230,.3);outline:1px solid var(--accent)}
  .bp-icon{font-size:26px;line-height:1}
  .bp-label{font-size:11px;color:var(--ink);word-break:break-word;
            max-width:64px;line-height:1.2}
  .bp-empty{grid-column:1/-1;color:var(--dim);font-size:12px;padding:16px;
            text-align:center}

  /* Compass -- a meter across the top, not a dial: ticks scroll sideways
     as the camera turns (see drawCompass()), the current heading always
     sits under the fixed centre marker, same idea as a flight HUD. */
  #compass{position:fixed;top:calc(8px + env(safe-area-inset-top));
           left:50%;transform:translateX(-50%);z-index:4;
           width:min(94vw,480px);height:32px;overflow:hidden;
           background:rgba(74,80,88,.75);border:1px solid var(--line);
           border-radius:8px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #compass-tape{position:absolute;top:0;left:50%;height:100%;white-space:nowrap}
  .compass-tick{position:absolute;top:0;bottom:0;transform:translateX(-50%);
                display:flex;align-items:center;justify-content:center}
  .compass-tick.minor::before{content:"";display:block;width:1px;height:8px;
                              background:var(--dim)}
  .compass-tick.major{font:700 11px/1 ui-monospace,monospace;color:var(--ink);
                      width:28px}
  .compass-tick.major.north{color:var(--accent)}
  #compass-marker{position:absolute;top:0;bottom:0;left:50%;width:2px;
                  background:var(--accent);transform:translateX(-50%);
                  pointer-events:none}

  /* Bottom-left, clear of the drawer's own thin tab strip at the very
     edge, and clear of the pad regardless of orientation (portrait:
     centred; landscape: pushed to the right). Off by default. */
  #minimap{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));
           left:60px;z-index:4;width:110px;height:110px;
           border-radius:8px;border:1px solid var(--line);
           background:rgba(74,80,88,.7);display:none;pointer-events:none}
  #minimap.on{display:block}

  /* Quickbar -- a fixed row of plain bubble slots, always visible, no tab
     to open first. Reuses the drawer's own .bubble look for consistency,
     but is not a drawer: nothing here slides. 245px clears the HUD (which
     itself starts at 160px, now that the top bar has two button rows). */
  #quickbar{position:fixed;top:calc(245px + env(safe-area-inset-top));
           left:50%;transform:translateX(-50%);z-index:4;
           display:flex;gap:8px;padding:6px}
  #quickbar .bubble{font-size:16px}

  /* Mesh Creator's live preview -- now living inside its page's own box
     (see the HTML) instead of a full-width strip above everything else,
     since the box is where non-button content goes. Still the exact same
     Renderer class/canvas as the main view underneath it. */
  #mesh-preview-wrap{flex:0 0 132px;position:relative;border-radius:8px;
                     overflow:hidden;border:1px solid var(--line)}
  #mesh-canvas{position:absolute;inset:0;width:100%;height:100%;
              display:block;touch-action:none}
  #mesh-part-list{display:flex;flex-direction:column;gap:4px;
      max-height:120px;min-height:0;overflow-y:auto;touch-action:pan-y}
  .mesh-part-row{font-size:12px;padding:8px 10px;
      border-radius:8px;background:var(--panel2);cursor:pointer;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mesh-part-row.on{background:var(--accent);color:var(--bg);font-weight:700}
  /* Build/palette's list of placeable kinds is the page's button grid
     itself now (#palette-list carries class="mkeys"), so each item is
     styled to match .mkey exactly rather than the old compact text row. */
  .palette-item{width:100%;height:100%;min-height:44px;box-sizing:border-box;
      display:flex;align-items:center;justify-content:center;text-align:center;
      padding:6px;border-radius:14px;font-size:clamp(11px,3.4vmin,15px);
      line-height:1.25;cursor:pointer;background:var(--glass-btn);
      border:1px solid var(--line);color:var(--ink)}
  .palette-item.on{border-color:var(--accent);color:var(--accent);
      box-shadow:0 0 0 1px var(--accent) inset}

  #veil{position:fixed;inset:0;z-index:9;display:none;place-items:center;
        background:rgba(58,63,70,.96);padding:24px;text-align:center}
  #veil.on{display:grid}
  #veil div{max-width:44ch;max-height:80vh;overflow-y:auto}
  #veil h1{font-size:19px;margin:0 0 10px}
  /* pre-wrap so a stack line keeps its shape, break-word so a long one still
     fits a phone rather than running off the side where it cannot be read */
  #veil p{color:var(--dim);font-size:14px;margin:0 0 18px;
          white-space:pre-wrap;overflow-wrap:break-word;text-align:left}
</style>
</head>
<body>

<!-- Two regions that never overlap: the world above, the pad below (or the
     world left and the pad right, sideways). The canvas is sized to its own
     region rather than the screen, so nothing is ever drawn underneath a
     button -- and the camera fits the board to whatever is left, because it
     measures the canvas rather than the window. -->
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="select-highlight"></div>
  <div id="merge-highlights"></div>

  <div id="bar">
    <div class="barrow">
      <div id="title">Spark 3D</div>
      <div class="badge" id="source">…</div>
    </div>
    <!-- split on purpose, not just wherever flex-wrap happens to break --
         pressed often, above pressed rarely, so the row you actually
         reach for stays short and predictable regardless of screen
         width. -->
    <div id="side">
      <button id="restart" data-editable title="restart">↺</button>
      <button id="recentre" data-editable title="recentre camera">⌖</button>
      <button id="fullscreen" data-editable title="fullscreen">⛶</button>
      <button id="mode" data-editable>…</button>
    </div>
    <div id="side-tools">
      <button id="save" data-editable title="save">save</button>
      <button id="save-as" data-editable title="save as a new 3d world file">new</button>
      <button id="backpack-toggle" data-editable title="backpack">🎒</button>
      <button id="properties-toggle" data-editable title="properties">⚙</button>
      <button id="edit-toggle" title="edit buttons: select, drag, resize, fade">✎</button>
    </div>
  </div>

  <div id="hud"></div>
  <div id="say"></div>
</div>

<div id="controls">
  <!-- Split into two thumb zones rather than one combined block: movement
       at bottom-left for the thumb that naturally rests there, actions at
       bottom-right for the other -- see the CSS comment above .pad for why,
       and why the four data-key values below are unchanged from the old
       single #pad (so saved button-editor layouts keep matching by key). -->
  <div id="pad-move" class="pad" aria-label="move">
    <button data-key="up" data-editable aria-label="up">▲</button>
    <button data-key="left" data-editable aria-label="left">◀</button>
    <button data-key="right" data-editable aria-label="right">▶</button>
    <button data-key="down" data-editable aria-label="down">▼</button>
  </div>
  <div id="pad-actions" class="pad" aria-label="actions">
    <button data-key="e" data-editable class="fire" aria-label="flip shape">⟲</button>
    <button data-key="f" data-editable class="fire" aria-label="resize">+</button>
    <button data-key="space" data-editable class="fire" aria-label="space">●</button>
    <button data-key="s" data-editable class="fire" aria-label="fly down">⤓</button>
    <button data-key="w" data-editable class="fire" aria-label="fly up">⤒</button>
  </div>
</div>

<div id="edit-grid-overlay"></div>

<!-- Shown for the whole time edit-buttons mode is on. The list covers
     every button that exists, including ones dragged off-screen or faded
     down to where you can no longer find them by tapping -- pick one here
     instead, then drag it and use the sliders. -->
<div id="edit-panel">
  <div id="edit-list"></div>
  <!-- slider and typed decimal percent, kept in sync both ways, and both
       filled in with whatever the selected button already has. -->
  <div class="row">
    <label style="flex:2">size <input id="edit-size" type="range" min="50" max="150" step="0.1" value="100"></label>
    <input id="edit-size-num" type="number" step="0.1" min="50" max="150" value="100">
  </div>
  <div class="row">
    <label style="flex:2">opacity <input id="edit-opacity" type="range" min="20" max="100" step="0.1" value="100"></label>
    <input id="edit-opacity-num" type="number" step="0.1" min="20" max="100" value="100">
  </div>
  <!-- typed position, as a decimal percent of the whole screen -- 0,0 is
       the top-left corner, 100,100 the bottom-right. Shows where the
       selected button is right now; type new numbers and press "go". -->
  <div class="row">
    <label style="flex:1">x% <input id="edit-x" type="number" step="0.1" min="0" max="100"></label>
    <label style="flex:1">y% <input id="edit-y" type="number" step="0.1" min="0" max="100"></label>
  </div>
  <div class="row">
    <button id="edit-goto-xy">go to x%, y%</button>
  </div>
  <!-- grid lock: dragging (and "go to x%, y%") snap to the nearest
       multiple of the grid size instead of landing anywhere exact. -->
  <div class="row">
    <label style="flex:2"><input id="edit-grid-on" type="checkbox"> grid lock</label>
    <input id="edit-grid-size" type="number" step="0.5" min="1" max="50" value="5" title="grid size, percent of screen">
  </div>
  <div class="row">
    <button id="edit-reset">reset this button</button>
    <button id="edit-reset-all">reset all buttons</button>
  </div>
  <!-- Named layouts: whole-screen snapshots of every button's position/
       size/opacity, saved under a name and reloaded later -- separate
       from the one working layout that's always live. -->
  <div class="row">
    <button id="edit-save-layout">save layout as…</button>
  </div>
  <div id="edit-layout-list"></div>
</div>

<!-- Backpack: a small virtual file system, styled like Windows File
     Explorer on purpose -- see ~/spark/CLAUDE.md, this is a deliberate
     exception to the rest of the game's gray/light-blue theme, not a
     drift from it. Starts with two folders, "buttons" and "backpack";
     what goes in them (and any further folders/files) is entirely up
     to whoever's using it -- New folder/New item/Delete work the same
     way in every folder you navigate into. -->
<div id="backpack-modal">
  <div class="modal-titlebar">
    <span>🎒 Backpack</span>
    <button id="backpack-close" title="close">✕</button>
  </div>
  <div class="mgrid">
    <div class="mkeys">
      <button id="bp-up" class="mkey" title="up one folder">⬆<br>up</button>
      <button id="bp-new-folder" class="mkey">📁<br>new folder</button>
      <button id="bp-new-file" class="mkey">📄<br>new item</button>
      <button id="bp-delete" class="mkey">🗑<br>delete</button>
    </div>
    <div class="mbox">
      <div id="backpack-path"></div>
      <div id="backpack-grid"></div>
    </div>
  </div>
</div>

<!-- Properties: near-fullscreen on purpose, but not edge to edge -- a
     visible margin of the world stays in view all the way round. -->
<div id="properties-modal">
  <div class="modal-titlebar">
    <span>⚙ Properties</span>
    <button id="properties-close" title="close">✕</button>
  </div>
  <div class="mgrid">
    <div class="mkeys">
      <button id="prop-gridlock-toggle" class="mkey">grid lock<br><small id="prop-gridlock-state">OFF</small></button>
      <button id="prop-minimap-toggle" class="mkey">minimap<br><small id="prop-minimap-state">OFF</small></button>
      <button id="prop-speed-dn5" class="mkey">speed −5</button>
      <button id="prop-speed-up5" class="mkey">speed +5</button>
      <button id="prop-speed-dn1" class="mkey">speed −1</button>
      <button id="prop-speed-up1" class="mkey">speed +1</button>
    </div>
    <div class="mbox">
      <div class="prop-row">
        <span class="prop-label">World time</span>
        <span id="prop-clock" class="prop-value">00:00:00</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Move speed (ticks/sec)</span>
        <input id="prop-speed-num" type="number" min="1" max="30" step="1" value="6" style="width:64px;flex:0 0 auto">
      </div>
    </div>
  </div>
</div>

<!-- Compass: which way the camera is facing, not the character -- the
     ring rotates under a fixed pointer, same idea as a map app. -->
<!-- A meter, not a dial: ticks scroll sideways as the camera turns, the
     current heading always sits under the fixed centre marker -- built
     and positioned in JS, see setupCompass()/drawCompass(). -->
<div id="compass" title="camera heading">
  <div id="compass-tape"></div>
  <div id="compass-marker"></div>
</div>

<!-- Minimap: off by default (toggle in Properties) -- one more
     always-on corner widget was the wrong call given how crowded the
     top of the screen already got once this session; opt-in instead. -->
<canvas id="minimap" width="110" height="110"></canvas>

<!-- Mesh Creator: build a custom multi-part shape (a cube here, a sphere
     there, each offset and sized on its own) and save it as a new,
     placeable kind. The preview is a second, small WebGL renderer -- same
     Renderer class as the main view, its own canvas, so it costs nothing
     extra to keep working and shows exactly what will actually be
     placed. -->
<div id="mesh-modal">
  <div class="modal-titlebar">
    <button class="modal-back" id="mesh-back" title="back">‹</button>
    <span id="mesh-title">🧩 Mesh Creator</span>
    <button id="mesh-close" title="close">✕</button>
  </div>
  <!-- The preview stays put across every page (including while picking a
       part's colour or shape -- seeing it update live there is useful,
       not just a leftover) rather than being torn down and rebuilt with
       the rest of the box each time: it is its own WebGL context, not
       cheap to recreate, and doing so would have to happen every single
       page switch. -->
  <div id="mesh-preview-wrap"><canvas id="mesh-canvas"></canvas></div>
  <!-- Same small-deck shape as the Object Inspector -- see MESH_PAGES/
       renderMeshPage() below, which reuses choiceKeys() from there for
       the colour and shape sub-pages rather than redefining them.
       Everything else (the part list, the fine dx/dy/dz/sx/sy/sz fields,
       loading/deleting a saved mesh) lives in the box on the top page --
       unchanged from before, just relocated, so nothing about the
       precision here was lost. -->
  <div class="mgrid">
    <div class="mkeys" id="mesh-keys"></div>
    <div class="mbox" id="mesh-box"></div>
  </div>
</div>

<!-- Build mode: pick which kind the place tile (▦ / "a") adds next, from
     everything the project already has plus anything saved in the Mesh
     Creator, and a Remove tool for taking placed objects back out. Local
     play only -- see setPaletteKind()'s own note. -->
<div id="palette-modal">
  <div class="modal-titlebar">
    <span>🎨 Build</span>
    <button id="palette-mesh-creator" title="open the Mesh Creator">🧩</button>
    <button id="palette-close" title="close">✕</button>
  </div>
  <div class="mgrid">
    <!-- one big button per placeable kind -- same "however many there are,
         scrolling in the same formation" idea README already documents for
         the browser editor's own big lists (the 35-tile palette, there). -->
    <div id="palette-list" class="mkeys"></div>
    <div class="mbox">
      <input id="palette-search" type="text" placeholder="search…">
      <div id="palette-count" class="prop-value"></div>
    </div>
  </div>
</div>

<!-- Object Inspector: colour, resize, and relocate whatever you're
     touching -- or, if you have a ghost pending, that instead, so a
     newly-spawned object can be set up before it's even confirmed. Local
     play only, same as Build mode: it writes straight into the live Thing
     instance, which only exists for the copy of the game in this tab. -->
<div id="inspect-modal">
  <div class="modal-titlebar">
    <button class="modal-back" id="inspect-back" title="back">‹</button>
    <span id="inspect-title">🎯 Object</span>
    <button id="inspect-delete" class="danger" title="delete this object">🗑</button>
    <button id="inspect-close" title="close">✕</button>
  </div>
  <!-- A small deck of its own, same "up to six buttons plus a box" shape
       as everything else -- see INSPECT_PAGES/renderInspectorPage() below.
       Colour and shape are each their own page (a scrolling grid of
       swatches/shapes, the "however many there are" idea README already
       documents for big lists); resize/stretch/move keep the exact same
       sliders and typed fields they always had, just relocated into the
       box, with quick-jump buttons alongside for the common cases --
       nothing about the fine control was lost. -->
  <div class="mgrid">
    <div class="mkeys" id="inspect-keys"></div>
    <div class="mbox" id="inspect-box"></div>
  </div>
</div>

<div id="veil"><div>
  <h1 id="veil-h">…</h1>
  <p id="veil-p"></p>
  <button id="veil-b">try again</button>
</div></div>


<script>
// Roughly in this order, top to bottom (search for the heading text to
// jump straight there -- this file grew a UI subsystem at a time, so nothing
// is alphabetical and nothing is grouped by file the way separate files
// would be):
//
//   SPARK-ENGINE-START..END   the JS twin of engine/*.py (see check_engines.py)
//   "The 3D view"             WebGL constants, colours, pushBox/Sphere/Cone
//   "class Renderer"          the WebGL renderer itself (also reused for
//                             the Mesh Creator's own preview canvas)
//   "touch: one finger..."    camera drag/pinch, then movement key input
//   "Button editor"           select/drag/resize/fade any button, named layouts
//   "Backpack"                the small virtual file system
//   "Properties"              grid-lock/world-clock/move-speed/minimap panel
//   "Mesh Creator"            multi-part custom shapes, with live preview
//   "Build mode / palette"    which kind the place tile adds next
//   "Object Inspector"        colour/resize/relocate/duplicate a placed object
//   "an "expanding" world"    windowed floor loading + auto-scatter
//   "the frame"               the render loop itself, and the HUD/compass/
//                             minimap/selection-ring draws it calls each tick
//   "Button Drawer"           the slide-out row of bubbles (see also
//                             ~/bubble-drawer/README.md, this is a copy)
//   "Quickbar"                the always-visible empty bubble slots
//   save/load, then the final (async () => { ... })() that actually starts
//   the page once everything above it is defined.
// ==== SPARK-ENGINE-START ====
// A second copy of engine/world.py and engine/tiles.py, in JavaScript, so that
// this page can run a game with nothing behind it -- no Termux, no Cloudflare,
// no GitHub. Two engines can drift apart, so tests/check_engines.py plays every
// game twice, once with each engine, from the same seed and with the same keys
// pressed on the same ticks, and demands the same board on every tick. If you
// change a rule in one, change it in the other -- that test will tell you if
// you forgot. It reaches this code through tests/engine_trace.js, which is why
// the markers around this section matter and why nothing here touches the DOM.

const RNG_MOD = 4294967296, RNG_MULT = 1664525, RNG_ADD = 1013904223;

class Rng {
  // The twin of engine/rng.py. Same constants, same order, same numbers.
  constructor(seed) {
    this.seeded = seed !== null && seed !== undefined;
    this.state = this.seeded ? ((Number(seed) % RNG_MOD) + RNG_MOD) % RNG_MOD : 0;
  }
  _next() {
    this.state = (this.state * RNG_MULT + RNG_ADD) % RNG_MOD;
    return this.state;
  }
  randrange(n) {
    if (!(n > 0)) throw new Error("randrange needs a positive number");
    if (!this.seeded) return Math.floor(Math.random() * n);
    return this._next() % n;
  }
  choice(seq) {
    if (!seq.length) throw new Error("cannot choose from nothing");
    if (!this.seeded) return seq[Math.floor(Math.random() * seq.length)];
    return seq[this._next() % seq.length];
  }
}

const STEPS = {
  up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0],
  north: [0, -1], "north-east": [1, -1], east: [1, 0], "south-east": [1, 1],
  south: [0, 1], "south-west": [-1, 1], west: [-1, 0], "north-west": [-1, -1],
};
// Same twelve, same order as tiles.STEP_LIST -- seeded `move random` depends on it.
const STEP_LIST = Object.keys(STEPS).map(k => STEPS[k]);
const OPEN_COOLDOWN = 30;

const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
const num = (v, fallback) => (v === undefined || v === null || v === "" ? fallback : Number(v));
const floorMod = (a, b) => ((a % b) + b) % b;

function matches(obj, kind) { return kind === "anything" || obj.kind === kind; }

function resolveStep(name, obj, it, rng) {
  if (has(STEPS, name)) return STEPS[name];
  if (name === "random") return rng.choice(STEP_LIST);
  if (name === "forward") return obj.facing;
  if (it === null || it === undefined) return [0, 0];
  let dx = it.x - obj.x, dy = it.y - obj.y;
  if (name === "away from it") { dx = -dx; dy = -dy; }
  if (Math.abs(dx) >= Math.abs(dy)) return [dx ? (dx > 0 ? 1 : -1) : 0, 0];
  return [0, dy ? (dy > 0 ? 1 : -1) : 0];
}

function remembered(world, text) {
  const t = String(text || "").trim();
  return String(has(world.memory, t) ? world.memory[t] : t);
}

// -- placeholders: one arbitrary slot, regarded three ways -----------------
// The mirror of the same section in engine/tiles.py. Every rule here has a
// twin there, including the clamp and the strict number pattern, which exist
// precisely so that these two engines cannot disagree about a sum.

const AXES = ["x", "y", "z"];
const FUNCTIONS = ["root", "round", "down", "up", "random"];
// How deep one named tile may sit inside another -- see MAX_COMBO_DEPTH in
// tiles.py. A named tile holding itself would otherwise spin for ever.
const MAX_COMBO_DEPTH = 8;
const LIMIT = 1000000000;
const NUMBER = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;

// Anything leaving clamp is finite, so every tile downstream can do plain
// arithmetic without checking. JSON can write neither NaN nor Infinity, so one
// loose in a placeholder would make a snapshot unreadable, not merely wrong.
function clamp(n) {
  const v = Number(n);
  if (v !== v) return 0;               // NaN is the only value unequal to itself
  return Math.max(-LIMIT, Math.min(LIMIT, v));
}

// Not Math.round: that sends exact halves upward, so Math.round(-2.5) is -2.
// Python's round sends them to the nearest even. This agrees with neither, and
// with itself in both engines, which is the point.
function whole(n) {
  const v = clamp(n);
  return v >= 0 ? Math.floor(v + 0.5) : Math.ceil(v - 0.5);
}

function place(world, who) {
  const name = String(who === undefined || who === null ? "" : who)
    .trim().toLowerCase();
  if (!name) return null;
  if (!has(world.places, name))
    world.places[name] = {name: "", value: 0, x: 0, y: 0, z: 0};
  return world.places[name];
}

function placed(world, who) {
  const name = String(who === undefined || who === null ? "" : who)
    .trim().toLowerCase();
  return has(world.places, name) ? world.places[name] : null;
}

function about(thing, what) {
  if (!thing) return 0;
  if (what === "x") return thing.x;
  if (what === "y") return thing.y;
  if (what === "health") return thing.health;
  if (what === "age") return thing.age;
  if (what === "travelled") return thing.travelled;
  return 0;
}

function apply(word, got, world) {
  if (word === "root") return got > 0 ? clamp(Math.sqrt(got)) : 0;
  if (word === "round") return whole(got);
  if (word === "down") return Math.floor(clamp(got));
  if (word === "up") return Math.ceil(clamp(got));
  if (word === "random") {
    const sides = Math.floor(clamp(got));
    return sides > 0 ? world.rng.randrange(sides) : 0;
  }
  return got;
}

function number(text, obj, world, it) {
  const t = String(text === undefined || text === null ? "" : text)
    .trim().toLowerCase();
  if (!t) return 0;
  if (NUMBER.test(t)) return clamp(Number(t));
  const cut = t.indexOf(" ");
  const head = cut < 0 ? t : t.slice(0, cut);
  const tail = cut < 0 ? "" : t.slice(cut + 1).trim();
  if (FUNCTIONS.indexOf(head) >= 0 && tail)
    return apply(head, number(tail, obj, world, it), world);
  if (head === "my") return clamp(about(obj, tail));
  if (head === "it") return clamp(about(it, tail));
  if (t === "score") return clamp(world.score);
  if (t === "tick") return clamp(world.tick);
  if (has(world.places, t)) return clamp(world.places[t].value);
  if (AXES.indexOf(tail) >= 0 && has(world.places, head))
    return clamp(world.places[head][tail]);
  return 0;
}

function divide(left, right) {
  return right ? clamp(left / right) : 0;
}

// Longhand, and not JavaScript's own %, for the reason spelt out in tiles.py:
// the two languages disagree about the sign. Left box wins, in both engines.
// (JavaScript's % happens to agree; Python's does not, so neither is trusted.)
function remainder(left, right) {
  if (!right) return 0;
  const over = Math.abs(left) % Math.abs(right);
  return clamp(left < 0 ? -over : over);
}

// The exponent is rounded to a whole number and fractional powers are left out
// on purpose -- that is what `root` is for, and asking either language for
// 2 ** 0.5 risks the engines differing in the last bit.
function power(base, exponent) {
  const exp = whole(exponent);
  if (exp < 0) return 0;
  if (exp === 0) return 1;
  if (base === 0 || base === 1) return base;
  if (base === -1) return exp % 2 ? -1 : 1;
  const steps = exp <= 64 ? exp : 64 + (exp % 2);
  let out = 1;
  for (let i = 0; i < steps; i++) {
    out = clamp(out * base);
    if (out === 0) break;
  }
  return out;
}

function total(a, op, b, obj, world, it) {
  const left = number(a, obj, world, it);
  const right = number(b, obj, world, it);
  if (op === "minus") return clamp(left - right);
  if (op === "times") return clamp(left * right);
  if (op === "divided by") return clamp(divide(left, right));
  if (op === "remainder") return clamp(remainder(left, right));
  if (op === "to the power of") return clamp(power(left, right));
  if (op === "but no more than") return clamp(Math.min(left, right));
  if (op === "but no less than") return clamp(Math.max(left, right));
  if (op === "how far from") return clamp(Math.abs(left - right));
  return clamp(left + right);
}

function compare(got, test, amount) {
  if (test === "at most") return got <= amount;
  if (test === "exactly") return got === amount;
  return got >= amount;
}

const SHOT_BRAIN = [
  {when: [{tile: "always", args: {}}],
   do: [{tile: "move", args: {dir: "forward"}}]},
  {when: [{tile: "touch", args: {kind: "anything"}}],
   do: [{tile: "damage", args: {target: "it", amount: 1}},
        {tile: "vanish", args: {target: "self"}}]},
  {when: [{tile: "spent", args: {}}],
   do: [{tile: "vanish", args: {target: "self"}}]},
  {when: [{tile: "at_edge", args: {}}],
   do: [{tile: "vanish", args: {target: "self"}}]},
];

class Thing {
  constructor(kind, x, y, template) {
    this.kind = kind;
    this.x = x; this.y = y;
    this.glyph = String(template.glyph || "?").slice(0, 1) || "?";
    this.color = template.color || "white";
    this.health = template.health === undefined ? 1 : template.health;
    this.solid = !!template.solid;
    this.role = template.role || "prop";
    this.shape = template.shape || "cube";   // one of SHAPES, defined below
    this.size = template.size === undefined ? 100 : template.size; // percent
    // Per-axis overrides, percent like size -- undefined means "use size",
    // the same on all three axes, until something explicitly stretches
    // just one of them (see the `stretch` tile, and buildThings() below).
    this.sx = template.sx; this.sy = template.sy; this.sz = template.sz;
    this.z = template.z === undefined ? 0 : template.z; // altitude, 0 = ground
    this.full = !!template.full;     // fills its whole grid cell
    this.ghost = !!template.ghost;   // placed but not confirmed yet
    this.flying = !!template.flying; // walking (grounded) unless true
    // A multi-part shape from the mesh creator: {shape,dx,dy,dz,sx,sy,sz,
    // color}[], each relative to this thing's own (x,y,z). Only rendering
    // cares -- when set, buildThings() draws these instead of the usual
    // single shape/size.
    this.parts = template.parts || null;
    this.brain = template.brain || [];
    this.facing = [0, -1];
    this.owner = null;
    this.alive = true;
    this.age = 0;
    this.travelled = 0;
    this.maxLife = 0;
    this.maxRange = 0;
    this.controller = null;
  }
}

// -- SENSORS, the WHEN half ------------------------------------------------
const SENSORS = {
  always: () => true,
  key: (obj, world, a) => world.keysFor(obj).has(a.key),
  see: (obj, world, a) => world.nearest(obj, a.kind, num(a.range, 6)),
  touch: (obj, world, a) => world.nearest(obj, a.kind, 1),
  timer: (obj, world, a) => world.tick % Math.max(1, num(a.every, 4)) === 0,
  health_below: (obj, world, a) => obj.health < num(a.value, 2),
  score_at_least: (obj, world, a) => world.score >= num(a.value, 10),
  chance: (obj, world, a) => world.rng.randrange(100) < num(a.percent, 25),
  at_edge: (obj, world) =>
    obj.x === 0 || obj.x === world.width - 1 ||
    obj.y === 0 || obj.y === world.height - 1,
  recall: (obj, world, a) => {
    const name = String(a.name === undefined ? "" : a.name).trim();
    return has(world.memory, name) &&
      world.memory[name] === String(a.value === undefined ? "" : a.value);
  },
  spent: (obj) => {
    if (obj.maxRange && obj.travelled >= obj.maxRange) return true;
    return !!(obj.maxLife && obj.age >= obj.maxLife);
  },
  place_has: (obj, world, a) => {
    const spot = placed(world, a.who);
    const face = a.face === undefined ? "value" : a.face;
    const got = spot && has(spot, face) ? clamp(spot[face]) : 0;
    return compare(got, a.test === undefined ? "at least" : a.test,
                   number(a.amount === undefined ? 1 : a.amount,
                          obj, world, null));
  },
  place_named: (obj, world, a) => {
    const spot = placed(world, a.who);
    return !!spot &&
      spot.name === String(a.text === undefined ? "" : a.text);
  },
  combo: (obj, world, a) => {
    const name = String(a.name === undefined ? "" : a.name);
    if (!has(world.combos, name) || world.comboDepth >= MAX_COMBO_DEPTH)
      return false;
    world.comboDepth += 1;
    try { return world.checkAll(obj, world.combos[name].when || []); }
    finally { world.comboDepth -= 1; }
  },
};

// -- ACTIONS, the DO half --------------------------------------------------
const ACTIONS = {
  move: (obj, world, a, it) => {
    const [dx, dy] = resolveStep(a.dir, obj, it, world.rng);
    if (dx || dy) { obj.facing = [dx, dy]; world.tryMove(obj, dx, dy); }
  },
  face: (obj, world, a, it) => {
    const [dx, dy] = resolveStep(a.dir, obj, it, world.rng);
    if (dx || dy) obj.facing = [dx, dy];
  },
  shoot: (obj, world, a, it) => {
    const [dx, dy] = resolveStep(a.dir, obj, it, world.rng);
    if (!(dx || dy)) return;
    const shot = world.spawn("shot", obj.x + dx, obj.y + dy);
    if (shot) {
      shot.facing = [dx, dy];
      shot.owner = obj;
      shot.maxRange = Math.max(0, num(a.reach, 8));
      shot.maxLife = Math.max(0, num(a.life, 12));
    }
  },
  say: (obj, world, a) => { world.message = a.text; },
  score: (obj, world, a) => { world.score += num(a.amount, 1); },
  damage: (obj, world, a, it) => {
    const victim = a.target === "self" ? obj : it;
    if (victim) {
      victim.health -= num(a.amount, 1);
      if (victim.health <= 0) world.remove(victim);
    }
  },
  heal: (obj, world, a) => { obj.health += num(a.amount, 1); },
  spawn: (obj, world, a) => { world.spawnSomewhere(a.kind); },
  shape: (obj, world, a, it) => {
    const victim = a.target === "self" ? obj : it;
    if (victim) {
      const at = SHAPES.indexOf(victim.shape || "cube");
      victim.shape = SHAPES[(at + 1) % SHAPES.length];
    }
  },
  resize: (obj, world, a, it) => {
    const victim = a.target === "self" ? obj : it;
    if (victim) {
      const size = (victim.size === undefined ? 100 : victim.size) + num(a.amount, 25);
      victim.size = Math.max(40, Math.min(220, size));
      // Uniform on purpose: any earlier stretch (see below) is exactly the
      // kind of thing "resize the whole object" should undo, not leave
      // stacked underneath a new overall size.
      victim.sx = victim.sy = victim.sz = undefined;
    }
  },
  // Independent of resize: only one axis moves, the other two keep
  // whatever they already were (size, or an earlier stretch of their own).
  stretch: (obj, world, a, it) => {
    const victim = a.target === "self" ? obj : it;
    if (!victim) return;
    const field = "s" + (a.axis === "y" || a.axis === "z" ? a.axis : "x");
    const base = victim.size === undefined ? 100 : victim.size;
    const current = victim[field] === undefined ? base : victim[field];
    victim[field] = Math.max(40, Math.min(220, current + num(a.amount, 25)));
  },
  fly: (obj, world, a) => {
    if (!obj.flying) return;   // walking mode -- grounded, fly buttons do nothing
    const step = a.dir === "down" ? -1 : 1;
    obj.z = Math.max(0, Math.min(8, (obj.z || 0) + step));
  },
  toggle_flight: (obj) => {
    obj.flying = !obj.flying;
    if (!obj.flying) obj.z = 0;   // land immediately -- walking mode means on the ground
  },
  // Press once to preview a new object where you stand, see-through and not
  // yet solid; press the same tile again to confirm the one you are already
  // previewing. One preview per presser at a time.
  place: (obj, world, a) => {
    // world.memory.palette_kind overrides which kind gets placed, when set
    // -- the build mode's palette writes it directly (see setPaletteKind
    // below). Pending lookup is by owner alone, not kind: switching the
    // palette mid-placement must still confirm whatever ghost is already
    // started, not strand it.
    const kind = world.memory.palette_kind || a.kind;
    const pending = world.things.find(t =>
      t.alive && t.ghost && t.owner === obj);
    if (pending) {
      pending.ghost = false;
      pending.solid = true;
    } else {
      const fresh = world.spawn(kind, obj.x, obj.y);
      if (fresh) {
        fresh.ghost = true;
        fresh.solid = false;
        fresh.owner = obj;
      }
    }
  },
  remember: (obj, world, a) => {
    const name = String(a.name === undefined ? "" : a.name).trim();
    if (name) world.memory[name] = String(a.value === undefined ? "" : a.value);
  },
  open: (obj, world, a) => {
    // The one tile that reaches outside the game. A browser tab cannot hand a
    // URL to an Android app the way termux-open-url can, and this page is often
    // the guest's view, so opening stays off here and the game is told so --
    // exactly what the Python tile does in a shared world.
    if (!world.mayOpen) { world.message = "opening is off in this world"; return; }
    const target = remembered(world, a.target);
    if (!target) return;
    const key = remembered(world, a.object) + "␀" + target;
    const when = world.opened[key];
    if (when !== undefined && world.tick - when < OPEN_COOLDOWN) return;
    world.opened[key] = world.tick;
    world.message = "cannot open things from a browser tab";
  },
  vanish: (obj, world, a, it) => {
    const victim = a.target === "self" ? obj : it;
    if (victim) world.remove(victim);
  },
  teleport: (obj, world) => {
    const spot = world.emptyCell();
    if (spot) { obj.x = spot[0]; obj.y = spot[1]; }
  },
  place_name: (obj, world, a) => {
    const spot = place(world, a.who);
    if (spot) spot.name = String(a.text === undefined ? "" : a.text);
  },
  place_value: (obj, world, a, it) => {
    const spot = place(world, a.who);
    if (spot) spot.value = total(a.a, a.op, a.b, obj, world, it);
  },
  place_vector: (obj, world, a, it) => {
    const spot = place(world, a.who);
    const axis = a.axis === undefined ? "x" : a.axis;
    if (spot && AXES.indexOf(axis) >= 0)
      spot[axis] = total(a.a, a.op, a.b, obj, world, it);
  },
  place_here: (obj, world, a) => {
    const spot = place(world, a.who);
    if (spot) { spot.x = clamp(obj.x); spot.y = clamp(obj.y); }
  },
  place_jump: (obj, world, a) => {
    const spot = placed(world, a.who);
    if (!spot) return;
    const x = whole(spot.x), y = whole(spot.y);
    if (world.inBounds(x, y)) { obj.x = x; obj.y = y; }
  },
  place_move: (obj, world, a) => {
    const spot = placed(world, a.who);
    if (!spot) return;
    const dx = whole(spot.x), dy = whole(spot.y);
    if (dx || dy) {
      obj.facing = [dx > 0 ? 1 : (dx ? -1 : 0), dy > 0 ? 1 : (dy ? -1 : 0)];
      world.tryMove(obj, dx, dy);
    }
  },
  combo: (obj, world, a, it) => {
    const name = String(a.name === undefined ? "" : a.name);
    if (!has(world.combos, name) || world.comboDepth >= MAX_COMBO_DEPTH) return;
    world.comboDepth += 1;
    try { world.doAll(obj, world.combos[name].do || [], it); }
    finally { world.comboDepth -= 1; }
  },
  win: (obj, world) => { world.status = "win"; },
  lose: (obj, world) => { world.status = "lose"; },
};

class World {
  constructor(project, seed) {
    this.project = project;
    this.rng = new Rng(seed);
    this.seed = seed;
    const settings = project.world || {};
    this.width = settings.width === undefined ? 30 : settings.width;
    this.height = settings.height === undefined ? 14 : settings.height;
    this.wrap = !!settings.wrap;

    this.templates = {};
    for (const c of project.characters || []) this.templates[c.kind] = c;
    if (!has(this.templates, "shot")) {
      this.templates.shot = {kind: "shot", glyph: "*", color: "yellow",
                             health: 1, brain: SHOT_BRAIN};
    }

    this.things = [];
    this.tick = 0;
    this.score = 0;
    this.message = "";
    this.status = null;
    this.keys = new Set();
    this.playerKeys = {};
    // The named tiles this game carries: a name -> a stored row. They live in
    // the game file, so they travel with it to GitHub and to other players.
    this.combos = {};
    for (const c of project.tiles || []) {
      const name = String(c.name === undefined ? "" : c.name);
      if (name.trim()) this.combos[name] = c;
    }
    this.comboDepth = 0;

    this.memory = {};
    this.places = {};
    this.mayOpen = false;
    this.opened = {};

    for (const char of project.characters || []) {
      const count = char.count === undefined ? 1 : char.count;
      for (let i = 0; i < count; i++) this.spawnSomewhere(char.kind);
    }
  }

  keysFor(thing) {
    if (thing.controller === null) return this.keys;
    return this.playerKeys[thing.controller] || new Set();
  }

  inBounds(x, y) {
    return x >= 0 && x < this.width && y >= 0 && y < this.height;
  }

  at(x, y) {
    return this.things.filter(t => t.alive && t.x === x && t.y === y);
  }

  emptyCell() {
    for (let i = 0; i < 200; i++) {
      const x = this.rng.randrange(this.width);
      const y = this.rng.randrange(this.height);
      if (!this.at(x, y).length) return [x, y];
    }
    return null;
  }

  nearest(obj, kind, reach) {
    let best = null, bestD = null;
    for (const other of this.things) {
      if (other === obj || !other.alive || other === obj.owner) continue;
      if (obj.owner !== null && other.owner === obj.owner) continue;
      if (!matches(other, kind)) continue;
      const dist = Math.max(Math.abs(other.x - obj.x), Math.abs(other.y - obj.y));
      if (dist <= reach && (bestD === null || dist < bestD)) { best = other; bestD = dist; }
    }
    return best;
  }

  spawn(kind, x, y) {
    const template = this.templates[kind];
    if (template === undefined) return null;
    if (!this.inBounds(x, y)) return null;
    const thing = new Thing(kind, x, y, template);
    this.things.push(thing);
    return thing;
  }

  spawnSomewhere(kind) {
    const spot = this.emptyCell();
    return spot ? this.spawn(kind, spot[0], spot[1]) : null;
  }

  remove(thing) { thing.alive = false; }

  tryMove(thing, dx, dy) {
    let x = thing.x + dx, y = thing.y + dy;
    if (this.wrap) { x = floorMod(x, this.width); y = floorMod(y, this.height); }
    else if (!this.inBounds(x, y)) return false;
    if (this.at(x, y).some(o => o.solid)) return false;
    thing.x = x; thing.y = y;
    thing.travelled += 1;
    return true;
  }

  /* Every sensor must pass. False if any fails, otherwise the first character
     one of them found -- which becomes "it" -- or true if none found anybody.
     An empty list passes, which is why a row with no WHEN tiles acts every
     tick. Split out of runRow so a named tile is checked by the same code. */
  checkAll(thing, uses) {
    let it = null;
    for (const use of uses) {
      const fn = SENSORS[use.tile];
      if (fn === undefined) return false;
      const result = fn(thing, this, use.args || {});
      if (!result) return false;
      if (it === null && result instanceof Thing) it = result;
    }
    return it === null ? true : it;
  }

  doAll(thing, uses, it) {
    for (const use of uses) {
      const fn = ACTIONS[use.tile];
      if (fn !== undefined) fn(thing, this, use.args || {}, it);
    }
  }

  runRow(thing, row) {
    const found = this.checkAll(thing, row.when || []);
    if (!found) return;
    this.doAll(thing, row.do || [], found instanceof Thing ? found : null);
  }

  step() {
    this.tick += 1;
    for (const thing of this.things.slice()) {
      if (!thing.alive || this.status) continue;
      thing.age += 1;
      for (const row of thing.brain) {
        if (!thing.alive) break;
        this.runRow(thing, row);
      }
    }
    this.things = this.things.filter(t => t.alive);

    const players = this.things.filter(t => t.role === "player");
    const wanted = (this.project.characters || []).some(c => c.role === "player");
    if (!players.length && wanted) this.status = "lose";
  }
}

// -- the smallest amount of matrix maths that will do ----------------------
function mat4Multiply(a, b) {
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++) {
      let sum = 0;
      for (let k = 0; k < 4; k++) sum += a[k * 4 + r] * b[c * 4 + k];
      out[c * 4 + r] = sum;
    }
  return out;
}

function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  const out = new Float32Array(16);
  out[0] = f / aspect; out[5] = f;
  out[10] = (far + near) * nf; out[11] = -1;
  out[14] = 2 * far * near * nf;
  return out;
}

function mat4LookAt(eye, centre, up) {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const norm = v => {
    const len = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / len, v[1] / len, v[2] / len];
  };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
                           a[2] * b[0] - a[0] * b[2],
                           a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const z = norm(sub(eye, centre));
  const x = norm(cross(up, z));
  const y = cross(z, x);
  return new Float32Array([
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -dot(x, eye), -dot(y, eye), -dot(z, eye), 1,
  ]);
}

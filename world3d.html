 * Harvest -- "walk up, pick it from a list, wait a few seconds, get an
 * item." The harvestable tile (SPARK-ENGINE section above, and
 * engine/tiles.py) only stamps the data -- {item, amount, seconds,
 * flashes} -- onto a Thing; everything here is what actually *runs* that
 * once you're standing next to one, which is inherently a player-input/
 * UI flow (pick one off a list, watch a countdown) rather than something
 * a tick-driven WHEN/DO row can usefully express on its own -- the same
 * reasoning Build mode and the Inspector are already "local play only"
 * for. Timed with performance.now(), not engine ticks: this never needs
 * to replay identically between the two engines the way gameplay itself
 * does, only to look right in this one tab.
 * ------------------------------------------------------------------- */
let harvestTarget = null;       // the Thing currently mid-harvest, or null
let harvestStartMs = 0;
let harvestFlashUntilMs = 0;    // set once the wait is over -- flashing instead now
let harvestFlashOn = true;      // current flash phase, read by frame() to hide/show it
let lastHarvestListKey = "";    // skip re-rendering the list when nothing's actually changed
const HARVEST_FLASH_MS = 800;

// Within reach (range 1), same as touch/the Inspector's own pick-it-up-
// from-the-ground reach -- anything else alive nearby that has harvest
// config on it at all.
function nearbyHarvestables() {
  if (!world) return [];
  const player = world.things.find(t => t.role === "player");
  if (!player) return [];
  return world.things.filter(t => t.alive && t !== player && t.harvest &&
    Math.max(Math.abs(t.x - player.x), Math.abs(t.y - player.y)) <= 1);
}

function renderHarvestList(nearby) {
  const panel = $("#harvest-panel");
  if (!nearby.length) {
    if (lastHarvestListKey !== "") { panel.classList.remove("on"); lastHarvestListKey = ""; }
    return;
  }
  // A cheap fingerprint of what's actually showing -- position included,
  // so something wandering past re-lists without needing a real diff.
  const key = nearby.map(t => t.kind + ":" + t.x + "," + t.y).join("|");
  if (key === lastHarvestListKey) return;
  lastHarvestListKey = key;
  panel.classList.add("on");
  $("#harvest-list").hidden = false;
  $("#harvest-progress").hidden = true;
  const box = $("#harvest-list");
  box.innerHTML = "";
  for (const t of nearby) {
    const row = document.createElement("div");
    row.className = "harvest-row";
    row.textContent = "harvest " + t.kind;
    row.onclick = () => startHarvest(t);
    box.appendChild(row);
  }
}

function startHarvest(target) {
  if (harvestTarget) return;   // already busy with one
  harvestTarget = target;
  harvestStartMs = performance.now();
  harvestFlashUntilMs = 0;
  harvestFlashOn = true;
  lastHarvestListKey = "";     // so the list looks fresh whenever this ends
  $("#harvest-list").hidden = true;
  $("#harvest-progress").hidden = false;
  $("#harvest-progress-label").textContent = "harvesting " + target.kind + "…";
  $("#harvest-progress-fill").style.width = "0%";
  $("#harvest-panel").classList.add("on");
}

function cancelHarvest() {
  harvestTarget = null;
  harvestFlashUntilMs = 0;
  harvestFlashOn = true;
  $("#harvest-progress").hidden = true;
}

function finishHarvest() {
  const target = harvestTarget, cfg = target.harvest;
  const player = world.things.find(t => t.role === "player");
  if (player && cfg) {
    const current = player.inventory[cfg.item] || 0;
    player.inventory[cfg.item] = current + cfg.amount;
    drawerToast("+" + cfg.amount + " " + cfg.item);
  }
  world.remove(target);
  harvestTarget = null;
  harvestFlashUntilMs = 0;
  harvestFlashOn = true;
  $("#harvest-progress").hidden = true;
}

// Called once a frame from frame(), before things are actually built for
// rendering -- harvestFlashOn has to be current *before* that filtering
// happens, or the flash would always be a frame behind.
function updateHarvest() {
  if (!world) { if (harvestTarget) cancelHarvest(); return; }
  if (!harvestTarget) { renderHarvestList(nearbyHarvestables()); return; }
  const player = world.things.find(t => t.role === "player");
  const cfg = harvestTarget.harvest;
  if (!harvestTarget.alive || !cfg || !player ||
      Math.max(Math.abs(harvestTarget.x - player.x), Math.abs(harvestTarget.y - player.y)) > 1) {
    cancelHarvest();   // it's gone, or you walked away -- no reward either way
    return;
  }
  // The same world.lines the draw_line tile writes to -- pushed fresh
  // every frame rather than through the tile (this is driven by a real-
  // time countdown, not a WHEN/DO row), but rendered exactly the same
  // way. world.step() clears the list once a tick; frame() runs far more
  // often than that, so this keeps re-appearing well before the next
  // clear ever has a chance to leave a visible gap.
  world.lines.push({
    x1: player.x, y1: player.y, z1: player.z || 0,
    x2: harvestTarget.x, y2: harvestTarget.y, z2: harvestTarget.z || 0,
    color: "gold",
  });
  const now = performance.now();
  if (harvestFlashUntilMs) {
    if (now >= harvestFlashUntilMs) { finishHarvest(); return; }
    const perPhase = HARVEST_FLASH_MS / (cfg.flashes * 2);
    const elapsedFlash = HARVEST_FLASH_MS - (harvestFlashUntilMs - now);
    harvestFlashOn = Math.floor(elapsedFlash / perPhase) % 2 === 0;
    $("#harvest-progress-label").textContent = cfg.item + "!";
    return;
  }
  const elapsed = (now - harvestStartMs) / 1000;
  $("#harvest-progress-fill").style.width = Math.min(100, (elapsed / cfg.seconds) * 100) + "%";
  if (elapsed >= cfg.seconds) { harvestFlashUntilMs = now + HARVEST_FLASH_MS; harvestFlashOn = true; }
}

function setupHarvest() {
  $("#harvest-cancel").onclick = cancelHarvest;
}

/* ---------------------------------------------------------------------
 * Inventory -- what you're carrying, read-only: no six-buttons-plus-a-box
 * shape here, unlike the other modals, since there's nothing to act on
 * besides looking. Deliberately its own thing, not folded into the
 * Backpack (a dev tool for saved buttons/notes -- see CLAUDE.md). Local
 * play only, same reasoning as everywhere else this file says that.
 * ------------------------------------------------------------------- */
function renderInventory() {
  const box = $("#inventory-box");
  box.innerHTML = "";
  const player = world && world.things.find(t => t.role === "player");
  const entries = player ? Object.entries(player.inventory).filter(([, n]) => n > 0) : [];
  if (!entries.length) {
    box.textContent = "(nothing yet -- harvest something first)";
    return;
  }
  entries.sort(([a], [b]) => a.localeCompare(b));
  for (const [item, count] of entries) {
    const row = document.createElement("div");
    row.className = "prop-row";
    row.innerHTML = '<span class="prop-label"></span><span class="prop-value"></span>';
    row.children[0].textContent = item;
    row.children[1].textContent = String(count);
    box.appendChild(row);
  }
}

function openInventory() {
  if (!world) { drawerToast("not available in LIVE mode"); return; }
  renderInventory();
  $("#inventory-modal").classList.add("on");
}

function setupInventory() {
  $("#inventory-close").onclick = () => $("#inventory-modal").classList.remove("on");
}

/* Hides every other button/panel on screen (see body.ui-hidden's own CSS)
 * for a clean, unobstructed view of the world -- a screenshot mode, in
 * effect, not a persisted preference: always starts shown again on the
 * next load rather than leaving a reload looking like every button
 * vanished for no visible reason. */
function setupUiToggle() {
  $("#ui-toggle").onclick = () => {
    if (editingButtons) return;   // the button editor owns taps for now
    const hidden = document.body.classList.toggle("ui-hidden");
    $("#ui-toggle").classList.toggle("on", hidden);
    $("#ui-toggle").textContent = hidden ? "🙈" : "👁";
  };
}

/* ---------------------------------------------------------------------
 * Chat -- the opposite of everything else in this file: only makes
 * sense in LIVE mode, since a local, single-tab copy of the game has
 * nobody else in it to talk to. Talks to the exact same api/chat the
 * browser editor's own box already uses (see index.html's runSaid/
 * sendChat/showNewChat, which this deliberately mirrors) -- one shared
 * chat per hosted game, arriving already folded into the same snapshot
 * poll() already polls for everything else, so this needs no polling of
 * its own. A handful of text commands, not the browser editor's full
 * navigation set -- there is nothing here for /play or /editor to
 * navigate to.
 * ------------------------------------------------------------------- */
let seenChat = 0;   // the highest chat line "n" already shown

// Consistent log history, requested directly: every line ever shown
// stays (no more silent 200-line trim), grouped into numbered pages --
// "title each [page] of chat by page number." A page's own number is
// stamped once, permanently, and never reused or renumbered even after
// /forget removes one -- pageNumber is the real identity a page is
// addressed by (see CHAT_COMMANDS.log/forget below), not its position
// among whatever pages still happen to exist.
const CHAT_PAGE_SIZE = 10;
let chatPageCount = 0;      // highest page number ever stamped
let chatPageEl = null;      // the currently-open page's own wrapper element
let chatPageLineCount = 0;  // lines already in that open page

function chatLine(who, text, cls) {
  const log = $("#chat-log");
  if (!chatPageEl || chatPageLineCount >= CHAT_PAGE_SIZE) {
    chatPageCount++;
    chatPageLineCount = 0;
    chatPageEl = document.createElement("div");
    chatPageEl.className = "chat-page";
    chatPageEl.pageNumber = chatPageCount;
    const header = document.createElement("div");
    header.className = "chat-line sys";
    header.textContent = "-- page " + chatPageCount + " --";
    chatPageEl.appendChild(header);
    log.appendChild(chatPageEl);
  }
  const line = document.createElement("div");
  line.className = "chat-line" + (cls ? " " + cls : "");
  if (who) {
    const whoEl = document.createElement("span");
    whoEl.className = "who";
    whoEl.textContent = who + ":";
    line.appendChild(whoEl);
    line.appendChild(document.createTextNode(" " + text));
  } else {
    line.textContent = text;
  }
  chatPageEl.appendChild(line);
  chatPageLineCount++;
  log.scrollTop = log.scrollHeight;
}

// Called every poll() -- chat rides along with the world snapshot the
// same way index.html's own showNewChat() already works from, so this
// needs no separate fetch of its own, live mode or not.
function showNewChat() {
  if (!live || !liveSnapshot) return;
  const myName = (liveSnapshot.you && liveSnapshot.you.name) || "";
  for (const line of liveSnapshot.chat || []) {
    if (line.n <= seenChat) continue;
    seenChat = line.n;
    if (line.who === myName) continue;   // already shown when we sent it
    chatLine(line.who, line.text);
  }
}

async function sendChatText(text) {
  if (!live) { chatLine("", "chat needs the server running", "bad sys"); return; }
  const res = await fetch("api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json", ...authHeaders()},
    body: JSON.stringify({text}),
  }).catch(() => null);
  if (!res || !res.ok) { chatLine("", "could not say that", "bad sys"); return; }
  const myName = (liveSnapshot && liveSnapshot.you && liveSnapshot.you.name) || "you";
  chatLine(myName, text, "mine");
}

// Shared by every /<verb> <x> <y> chat command below (mine/attack/
// recruit/dismiss): parses "x y" out of the typed rest of the line,
// returning [[x, y], null] or [null, complaintLine].
function parseXY(rest, usage) {
  const parts = String(rest || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return [null, "try: " + usage];
  const x = parseInt(parts[0], 10), y = parseInt(parts[1], 10);
  if (!Number.isFinite(x) || !Number.isFinite(y)) {
    return [null, "x and y need to be plain numbers: " + usage];
  }
  return [[x, y], null];
}

// The living player character, or a one-line complaint -- shared by
// every /<verb> <x> <y> command below.
function findHero(verb) {
  const hero = world.things.find(t => t.role === "player" && t.alive);
  return hero ? [hero, null] : [null, "no player character to " + verb + " with"];
}

// null if adjacent (the same one square `touch` itself always means),
// else the complaint -- shared by every physical (not /name, which
// isn't) /<verb> <x> <y> command below.
function tooFar(hero, x, y) {
  if (Math.max(Math.abs(hero.x - x), Math.abs(hero.y - y)) > 1) {
    return "too far away — get within one square of (" + x + ", " + y + ") first";
  }
  return null;
}

// Structure kinds nobody but the player ever creates in outpost, so
// "every wall/turret in the world" already means "every one the
// player built" -- there's no ownership field on a structure the way
// a recruited unit's own `leader` is one. Specific to outpost.json's
// own roster on purpose, mirroring engine/runner.py's own list.
const STRUCTURE_KINDS = ["wall", "turret"];

// Kinds a bare, unled one of can be recruited -- everything the
// hero's own "1"/"2" buy rows can hire, plus the free-roaming
// companions already scattered around at the start. Mirroring
// engine/runner.py's own list.
const RECRUITABLE_KINDS = ["companion", "worker", "soldier"];

// The hero, plus everything led by the hero, plus every player-built
// structure -- "yours" for /units and /name. [null, []] if there's no
// living player character at all.
function ownedThings() {
  const hero = world.things.find(t => t.role === "player" && t.alive);
  if (!hero) return [null, []];
  const owned = [hero];
  for (const t of world.things) {
    if (t === hero || !t.alive) continue;
    if (t.leader === hero || STRUCTURE_KINDS.includes(t.kind)) owned.push(t);
  }
  return [hero, owned];
}

// (category, syntax, description) -- kept in sync by hand with
// engine/runner.py's own COMMAND_CATALOG. CATEGORY_ORDER is the order
// "/help commands" groups and lists them in; a category only shows up
// if it actually has a command in it, so the two engines' slightly
// different sets (no /quit here, no /who or /clear there) never leave
// a heading with nothing under it.
const COMMAND_CATALOG = [
  ["info", "/help [commands [description]]",
   "show this, or just the command list (add \"description\" for what each one does)"],
  ["info", "/who", "who is connected"],
  ["info", "/units", "list everything you own or possess, and where it is"],
  ["action", "/mine <x> <y>", "mine the ore at that spot, if you're next to it"],
  ["action", "/attack <x> <y>", "hit the bandit at that spot, if you're next to it"],
  ["action", "/recruit <x> <y>", "recruit whatever's bare there, if you're next to it"],
  ["action", "/dismiss <x> <y>", "release whatever's yours there, if you're next to it"],
  ["roster", "/name <x> <y> <new name>", "rename whatever's yours at that spot"],
  ["log", "/log [n]", "scroll to a numbered page of this log; latest if n is left off"],
  ["log", "/forget <n>", "remove page n from this log for good"],
  ["log", "/clear", "empty this log"],
];
const CATEGORY_ORDER = ["info", "action", "roster", "log"];
const CATEGORY_TITLE = {info: "Info", action: "Actions", roster: "Roster", log: "Log"};

// The whole command reference, grouped by type -- "/help commands"
// (bare) or "/help commands description" (with what each one does).
// Also folded into plain /help's own tail, after a game's own text.
function commandListLines(withDescription) {
  const lines = [];
  for (const cat of CATEGORY_ORDER) {
    const rows = COMMAND_CATALOG.filter(c => c[0] === cat);
    if (!rows.length) continue;
    lines.push(CATEGORY_TITLE[cat] + ":");
    for (const [, syntax, desc] of rows) {
      lines.push("  " + syntax + (withDescription ? " — " + desc : ""));
    }
  }
  return lines;
}

const CHAT_COMMANDS = {
  // A game's own "how to play" -- an optional plain-text field on the
  // game JSON itself (project.help), same idea as its name or world
  // size: written once by whoever built the game, not a chat feature of
  // its own. Works whether or not the server's running -- unlike saying
  // something to others, showing your own local text needs nothing but
  // this tab. "commands" (optionally "description" too) shows just the
  // command reference on its own, grouped by type.
  help(rest) {
    const words = String(rest || "").trim().split(/\s+/).filter(Boolean);
    if (words[0] === "commands") {
      for (const line of commandListLines(words[1] === "description")) chatLine("", line, "sys");
      return;
    }
    if (project && project.help) {
      for (const line of String(project.help).split("\n")) chatLine("", line, "sys");
      chatLine("", "—", "sys");
    }
    for (const line of commandListLines(true)) chatLine("", line, "sys");
    chatLine("", "anything else is said to the others, if the server is running", "sys");
  },
  who() {
    const people = (liveSnapshot && liveSnapshot.people) || [];
    if (!people.length) { chatLine("", "nobody else is connected", "sys"); return; }
    for (const p of people) chatLine("", p.name + " — " + p.role, "sys");
  },
  clear() {
    $("#chat-log").textContent = "";
    // The wrapper chatLine() was still writing into is gone now -- start
    // the next line fresh rather than appending into a detached, now
    // invisible page. Numbering itself keeps climbing (page numbers are
    // permanent labels, never reused, even across a /clear).
    chatPageEl = null;
    chatPageLineCount = 0;
  },
  // Scrolls to a numbered page rather than replacing the view -- this
  // log is a live scrollback, not a single screen the way the
  // terminal's own /log is. Pages are addressed by their own stamped
  // number, not by position, so a /forget-ten gap never shifts anyone
  // else's number.
  log(rest) {
    if (!chatPageCount) { chatLine("", "nothing logged yet", "sys"); return; }
    rest = String(rest || "").trim();
    let n = chatPageCount;
    if (rest) {
      n = parseInt(rest, 10);
      if (!Number.isFinite(n)) { chatLine("", "page number needs to be a plain number: /log [n]", "sys"); return; }
    }
    if (n < 1 || n > chatPageCount) {
      chatLine("", "no page " + n + " -- there are " + chatPageCount, "sys"); return;
    }
    const target = [...$("#chat-log").children].find(p => p.pageNumber === n);
    if (!target) { chatLine("", "page " + n + " was already forgotten", "sys"); return; }
    $("#chat-log").scrollTop = target.offsetTop || 0;
  },
  // Removes one page's own wrapper outright -- requested directly,
  // "remove from history after submited." Its own confirmation lands
  // in whatever page is current, same as any other command's output.
  forget(rest) {
    const n = parseInt(String(rest || "").trim(), 10);
    if (!Number.isFinite(n)) { chatLine("", "page number needs to be a plain number: /forget <n>", "sys"); return; }
    if (!chatPageCount || n < 1 || n > chatPageCount) {
      chatLine("", "no page " + n + " -- there are " + chatPageCount, "sys"); return;
    }
    const log = $("#chat-log");
    const target = [...log.children].find(p => p.pageNumber === n);
    if (!target) { chatLine("", "page " + n + " was already forgotten", "sys"); return; }
    const removed = Math.max(0, target.children.length - 1);   // minus its own header
    if (target.remove) target.remove(); else log.removeChild(target);
    if (target === chatPageEl) { chatPageEl = null; chatPageLineCount = 0; }
    chatLine("", "page " + n + " forgotten (" + removed + " line" + (removed === 1 ? "" : "s") + " removed)", "sys");
  },
  // Same idea as outpost's own touch(ore)+give_item brain row -- gather
  // from the ore at an exact spot rather than walking up to it blind.
  // Still one-square range, the same as `touch` itself always means;
  // this is a shortcut for reaching a known spot, not remote mining.
  // Local-play only in effect, like Harvest/Build above: it edits the
  // local world directly, which a game someone else is hosting neither
  // sees nor keeps.
  mine(rest) {
    if (!world) { chatLine("", "no game running to mine in", "sys"); return; }
    const [xy, xyErr] = parseXY(rest, "/mine <x> <y>");
    if (xyErr) { chatLine("", xyErr, "sys"); return; }
    const [x, y] = xy;
    const [hero, heroErr] = findHero("mine");
    if (heroErr) { chatLine("", heroErr, "sys"); return; }
    const farErr = tooFar(hero, x, y);
    if (farErr) { chatLine("", farErr, "sys"); return; }
    const target = world.things.find(t => t.alive && t.kind === "ore" && t.x === x && t.y === y);
    if (!target) { chatLine("", "no ore at (" + x + ", " + y + ")", "sys"); return; }
    hero.inventory.ore = (hero.inventory.ore || 0) + 1;
    chatLine("", "mined 1 ore at (" + x + ", " + y + ") — you now have " + hero.inventory.ore, "sys");
  },
  // /attack <x> <y>: the same damage touching a bandit already does,
  // aimed at an exact spot -- a shortcut for reaching it, not ranged
  // combat across the map. Matches the hero's own touch(bandit) ->
  // damage it 2 row exactly.
  attack(rest) {
    if (!world) { chatLine("", "no game running to attack with", "sys"); return; }
    const [xy, xyErr] = parseXY(rest, "/attack <x> <y>");
    if (xyErr) { chatLine("", xyErr, "sys"); return; }
    const [x, y] = xy;
    const [hero, heroErr] = findHero("attack");
    if (heroErr) { chatLine("", heroErr, "sys"); return; }
    const farErr = tooFar(hero, x, y);
    if (farErr) { chatLine("", farErr, "sys"); return; }
    const target = world.things.find(t => t.alive && t.kind === "bandit" && t.x === x && t.y === y);
    if (!target) { chatLine("", "no bandit at (" + x + ", " + y + ")", "sys"); return; }
    target.health -= 2;
    if (target.health <= 0) {
      world.remove(target);
      chatLine("", "attacked (" + x + ", " + y + ") — bandit destroyed", "sys");
    } else {
      chatLine("", "attacked (" + x + ", " + y + ") — bandit has " + target.health + " health left", "sys");
    }
  },
  // /recruit <x> <y>: the same as touching a companion and pressing e,
  // aimed at an exact spot -- and, unlike the ordinary e key (which
  // only ever touches kind "companion"), works on a bare worker or
  // soldier too, including one you dismissed earlier and want back.
  recruit(rest) {
    if (!world) { chatLine("", "no game running to recruit with", "sys"); return; }
    const [xy, xyErr] = parseXY(rest, "/recruit <x> <y>");
    if (xyErr) { chatLine("", xyErr, "sys"); return; }
    const [x, y] = xy;
    const [hero, heroErr] = findHero("recruit");
    if (heroErr) { chatLine("", heroErr, "sys"); return; }
    const farErr = tooFar(hero, x, y);
    if (farErr) { chatLine("", farErr, "sys"); return; }
    const target = world.things.find(t => t.alive && RECRUITABLE_KINDS.includes(t.kind)
      && t.leader === null && t.x === x && t.y === y);
    if (!target) { chatLine("", "nothing recruitable at (" + x + ", " + y + ")", "sys"); return; }
    target.leader = hero;
    chatLine("", "recruited the " + target.kind + " at (" + x + ", " + y + ")", "sys");
  },
  // /dismiss <x> <y>: the same as touching one of yours and pressing
  // r, aimed at an exact spot -- and, unlike the ordinary r key,
  // works on a bought worker or soldier too, which otherwise has no
  // way to be released at all.
  dismiss(rest) {
    if (!world) { chatLine("", "no game running to dismiss with", "sys"); return; }
    const [xy, xyErr] = parseXY(rest, "/dismiss <x> <y>");
    if (xyErr) { chatLine("", xyErr, "sys"); return; }
    const [x, y] = xy;
    const [hero, heroErr] = findHero("dismiss");
    if (heroErr) { chatLine("", heroErr, "sys"); return; }
    const farErr = tooFar(hero, x, y);
    if (farErr) { chatLine("", farErr, "sys"); return; }
    const target = world.things.find(t => t.alive && t.leader === hero && t.x === x && t.y === y);
    if (!target) { chatLine("", "nothing of yours to dismiss at (" + x + ", " + y + ")", "sys"); return; }
    target.leader = null;
    chatLine("", "dismissed the " + target.kind + " at (" + x + ", " + y + ")", "sys");
  },
  // Everything you own or possess, named and located -- the "selector
  // menu" for referring back to something later, with /name below, and
  // with /mine already taking a coordinate the same way.
  units() {
    if (!world) { chatLine("", "no game running", "sys"); return; }
    const [hero, owned] = ownedThings();
    if (!hero) { chatLine("", "no player character", "sys"); return; }
    chatLine("", "yours:", "sys");
    for (const t of owned) {
      chatLine("", "  " + (t.label || t.kind) + " (" + t.kind + ") at ("
        + t.x + ", " + t.y + ")", "sys");
    }
  },
  // /name <x> <y> <new name>: not range-limited the way /mine is --
  // naming isn't a physical act the way mining is.
  name(rest) {
    if (!world) { chatLine("", "no game running", "sys"); return; }
    const parts = String(rest || "").trim().split(/\s+/);
    if (parts.length < 3 || parts[0] === "") {
      chatLine("", "try: /name <x> <y> <new name>", "sys"); return;
    }
    const x = parseInt(parts[0], 10), y = parseInt(parts[1], 10);
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      chatLine("", "x and y need to be plain numbers: /name <x> <y> <new name>", "sys"); return;
    }
    const newName = parts.slice(2).join(" ").trim();
    if (!newName) { chatLine("", "give it an actual name: /name <x> <y> <new name>", "sys"); return; }
    const [hero, owned] = ownedThings();
    if (!hero) { chatLine("", "no player character", "sys"); return; }
    const target = owned.find(t => t.x === x && t.y === y);
    if (!target) { chatLine("", "nothing of yours at (" + x + ", " + y + ")", "sys"); return; }
    target.label = newName;
    chatLine("", target.kind + " is now called \"" + newName + "\"", "sys");
  },
};

async function runChatSaid(said) {
  said = said.trim();
  if (!said) return;
  if (!said.startsWith("/")) { await sendChatText(said); return; }
  const cut = said.indexOf(" ");
  const word = (cut < 0 ? said.slice(1) : said.slice(1, cut)).toLowerCase();
  const rest = cut < 0 ? "" : said.slice(cut + 1);
  const fn = CHAT_COMMANDS[word];
  if (!fn) { chatLine("", "no such command: /" + word + " — try /help", "bad sys"); return; }
  await fn(rest);
}

function openChat() {
  $("#chat-modal").classList.add("on");
  if (!live) chatLine("", "chat needs the server running -- switch to \"go live\" first", "sys");
  $("#chat-input").focus();
}

function setupChat() {
  $("#chat-toggle").onclick = () => {
    if (editingButtons) return;   // the button editor owns taps for now
    openChat();
  };
  $("#chat-close").onclick = () => $("#chat-modal").classList.remove("on");
  const send = () => {
    const input = $("#chat-input");
    const text = input.value;
    input.value = "";
    runChatSaid(text);
  };
  $("#chat-send").onclick = send;
  $("#chat-input").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
  });
}

/* Quickbar -- a fixed row of plain bubble slots, always visible, no tab
 * to slide open first (that's what the drawer is for). Each slot is
 * still a real [data-editable] button, so it can be dragged/resized/
 * faded the same as anything else -- there's just nothing assigned to
 * any of them yet. */
function makeQuickbar(count) {
  const bar = document.createElement("div");
  bar.id = "quickbar";
  for (let i = 1; i <= count; i++) {
    const el = document.createElement("div");
    el.className = "bubble";
    el.textContent = String(i);
    el.title = "quickbar slot " + i;
    el.onclick = () => { if (!editingButtons) drawerToast("slot " + i + " -- nothing set yet"); };
    registerEditable(el, "quickbar:" + i, "quickbar slot " + i);
    bar.appendChild(el);
  }
  document.body.appendChild(bar);
}

function makeDrawer({edge = "left", buttons = []}) {
  const root = document.createElement("div");
  root.className = "drawer";
  root.dataset.edge = edge;

  const tab = document.createElement("div");
  tab.className = "tab";
  tab.innerHTML = '<span>&#8250;</span>';
  root.appendChild(tab);

  const bubbles = document.createElement("div");
  bubbles.className = "bubbles";
  root.appendChild(bubbles);

  const nextUid = () => "bub" + Math.random().toString(36).slice(2, 9);
  const list = buttons.slice();
  for (const b of list) b.__uid = b.__uid || nextUid();
  let selected = list.length ? 0 : null;
  // Armed by ×: the next bubble you tap is the one that gets removed,
  // instead of whatever happened to be selected already. A bubble marked
  // `locked: true` in its config (the built-ins this drawer ships with,
  // e.g.) refuses to be picked that way at all.
  let removing = false;

  const bubbleEl = (icon, title, extraClass) => {
    const el = document.createElement("div");
    el.className = "bubble" + (extraClass ? " " + extraClass : "");
    if (title) el.title = title;
    el.textContent = icon;
    return el;
  };

  function render() {
    bubbles.innerHTML = "";
    list.forEach((b, i) => {
      const el = bubbleEl(b.icon || "?", b.label || "");
      el.classList.toggle("selected", i === selected);
      el.classList.toggle("armed", !!(b.armed && b.armed()));
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (editingButtons) return;   // the button editor owns taps for now
        if (removing) {
          if (b.locked) {
            el.classList.add("shake");
            setTimeout(() => el.classList.remove("shake"), 320);
            return;   // stays armed -- this one just is not removable
          }
          list.splice(i, 1);
          if (selected === i) selected = null;
          else if (selected !== null && selected > i) selected -= 1;
          removing = false;
          render();
          return;
        }
        selected = i;
        render();
        if (b.onTap) b.onTap();
        // Rendered again after onTap() runs, not just before -- the first
        // render is for instant tap feedback (the selected ring); this
        // one is so a bubble whose onTap arms an ongoing mode (b.armed,
        // e.g. 🧬 merge) picks up its pulsing state right away instead of
        // only on whatever bubble happens to be tapped next.
        render();
      });
      // Registered on every render, not just once -- the drawer rebuilds
      // this element from scratch each time, and registerEditable both
      // points the editor at the new one and re-applies its saved size/
      // position/fade, so customizing a bubble survives its own redraws.
      registerEditable(el, "drawer:" + edge + ":" + b.__uid, b.label || b.icon);
      bubbles.appendChild(el);
    });

    const add = bubbleEl("+", "add a button before the selected one", "control add");
    add.addEventListener("click", (e) => {
      e.stopPropagation();
      if (editingButtons) return;
      removing = false;   // adding cancels an armed removal
      const icon = prompt("icon for the new button", "★");
      if (icon === null) { render(); return; }
      const at = selected === null ? list.length : selected;
      const fresh = {icon: icon || "•", label: "new", __uid: nextUid(),
                     onTap: () => drawerToast(icon || "•")};
      list.splice(at, 0, fresh);
      selected = at;
      render();
    });
    registerEditable(add, "drawer:" + edge + ":add", "add a button (drawer control)");
    bubbles.appendChild(add);

    const remove = bubbleEl("×",
      removing ? "tap the button to remove (tap × again to cancel)" : "remove a button",
      "control remove");
    remove.classList.toggle("armed", removing);
    remove.addEventListener("click", (e) => {
      e.stopPropagation();
      if (editingButtons) return;
      removing = !removing;
      render();
    });
    registerEditable(remove, "drawer:" + edge + ":remove", "remove a button (drawer control)");
    bubbles.appendChild(remove);
  }
  render();

  let drawerOpen = false;
  const setOpen = (v) => {
    drawerOpen = v;
    root.classList.toggle("open", drawerOpen);
    if (!v && removing) { removing = false; render(); }   // closing cancels it
    // Merge armed (🧬) the same way -- was only handled for remove above,
    // so closing the drawer used to leave merge silently armed: the next
    // object tapped anywhere, drawer closed or not, would still queue for
    // merging instead of opening the Inspector, with nothing on screen
    // but a small green ring to explain why. A plain reset, not
    // toggleMerge() -- that would try to *complete* the merge (prompting
    // for a name) rather than cancel it.
    if (!v && mergeArmed) { mergeArmed = false; mergeSelection = []; render(); }
  };
  tab.addEventListener("click", (e) => {
    e.stopPropagation();
    setOpen(!drawerOpen);
  });
  document.addEventListener("click", () => { if (drawerOpen) setOpen(false); });

  document.body.appendChild(root);
  return {root, open: () => setOpen(true), close: () => setOpen(false)};
}

function fail(heading, detail) {
  $("#veil-h").textContent = heading;
  $("#veil-p").textContent = detail;
  $("#veil").classList.add("on");
}

/* Say what went wrong, on the screen.
 *
 * A phone browser has no console you can open. Chrome on Android will not show
 * you a stack trace however hard you tap, so an uncaught error here would be a
 * black rectangle and no way to find out why -- which is useless to report and
 * useless to fix. Anything that escapes gets written on the page instead, in
 * words that can be read out or photographed. */
function reportCrash(what, err) {
  const where = err && err.stack ? String(err.stack).split("\n")[0] : "";
  fail("Spark 3D hit a problem",
       what + ": " + ((err && err.message) || err || "unknown") +
       (where ? "\n\n" + where : ""));
  $("#veil-b").textContent = "reload";
  $("#veil-b").onclick = () => location.reload();
}

window.addEventListener("error", e => reportCrash("error", e.error || e.message));
window.addEventListener("unhandledrejection",
                        e => reportCrash("unfinished request", e.reason));

(async function boot() {
  try {
    renderer = new Renderer($("#gl"));
  } catch (err) {
    fail("This browser has no WebGL",
         "Spark 3D needs WebGL, which this browser did not give us. The flat " +
         "editor still works: go back and press play there. (" + err.message + ")");
    $("#veil-b").onclick = () => location.href = "./";
    return;
  }

  const [found, where] = await findProject();
  project = found;
  lastSaveName = project.name || null;
  // Already the file this world came from -- overwriting it via plain
  // "save" is expected, not a collision to ask about.
  if (project.name) confirmedNames.add(project.name);
  $("#title").textContent = project.name || "Spark 3D";

  const snap = await probeLive();
  if (snap) startLive(snap); else startLocal();

  bindCamera($("#gl"));
  setupObjectPicking($("#gl"));
  bindControls();
  makeDrawer({edge: "left", buttons: [
    // press once for a see-through preview where you stand, press again
    // (the same bubble, or the "a" key) to confirm and place it for real.
    // locked: it ships with this drawer, not something you added, so ×
    // refuses to pick it -- add/remove is for your own bubbles only.
    {icon: "▦", label: "add a 3D object", onTap: () => pressed.add("a"), locked: true},
    // walking (grounded, w/s fly buttons do nothing) <-> flying (w/s
    // change altitude). Same key ("d") as pressing it on a keyboard.
    {icon: "🕊", label: "toggle walk/fly mode", onTap: () => pressed.add("d"), locked: true},
    // "remove" is not a real keyboard key -- pressed is just a set of
    // strings, and nothing requires those strings to be real keys. Any
    // WHEN row can watch for one that only a UI button ever sends.
    {icon: "🗑", label: "remove the object I'm touching", onTap: () => pressed.add("remove"), locked: true},
    {icon: "🎨", label: "build: pick what to place, or open the Mesh Creator",
     onTap: () => openPalette(), locked: true},
    // whatever you're touching, or your pending ghost if you have one --
    // colour, resize, and relocate it directly, live.
    {icon: "🎯", label: "inspect: colour, resize, relocate", onTap: () => openInspector(), locked: true},
    // arm it, tap several objects, tap again to combine them into one
    // placeable kind -- see toggleMerge() and the Merge section above.
    {icon: "🧬", label: "merge: tap several objects, tap again to combine them",
     onTap: () => toggleMerge(), armed: () => mergeArmed, locked: true},
    // read-only -- what harvesting has actually given you so far.
    {icon: "📦", label: "inventory: what you're carrying", onTap: () => openInventory(), locked: true},
  ]});
  setupBackpack();
  setupProperties();
  setupMeshCreator();
  setupPalette();
  setupInspector();
  setupCompass();
  setupHarvest();
  setupInventory();
  setupUiToggle();
  setupChat();
  makeQuickbar(7);

  // Turning the phone swaps which region is which shape, and a camera framed
  // for one is wrong for the other. Only a flip re-fits it, though: Chrome
  // fires resize every time its address bar slides away, and re-framing on
  // those would yank the view back out from under anyone who had zoomed in.
  let wasWide = null;
  const onResize = () => {
    renderer.resize();
    syncBarHeight();
    checkOrientationSwitch();   // swap to the other preset first, if this is a real rotation
    syncButtonPositions();      // then re-anchor every custom position to the new screen shape
    const wide = $("#gl").clientWidth >= $("#gl").clientHeight;
    if (wasWide !== null && wide !== wasWide) renderer.frameBoard();
    wasWide = wide;
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  onResize();
  pollTimer = setInterval(poll, 130);
  requestAnimationFrame(frame);

  if (where === "the built-in demo")
    $("#say").textContent = "no game found - showing the built-in demo";
})();
</script>

    {kind: "bug", glyph: "x", color: "red", health: 2, count: 3,
     solid: false, role: "prop",
     brain: [
       {when: [{tile: "timer", args: {every: 2}}, {tile: "see", args: {kind: "hero", range: 7}}],
        do: [{tile: "move", args: {dir: "toward it"}}]},
       {when: [{tile: "timer", args: {every: 3}}],
        do: [{tile: "move", args: {dir: "random"}}]},
     ]},
  ],
};

let renderer = null;
let world = null;             // the local engine's world, when running locally
let project = null;           // the game data
let lastSaveName = null;      // the file "save" quick-saves back over
let live = false;             // are we mirroring a real server?
let liveSnapshot = null;
let forcedLocal = false;      // the user pressed "run here"
let stepTimer = null, pollTimer = null;
const pressed = new Set();
let editingButtons = false;   // true while the button editor is open

function authHeaders() {
  const headers = {};
  const token = localStorage.getItem(LS_TOKEN);
  const key = localStorage.getItem(LS_OWNER);
  if (token) headers["X-Spark-Token"] = token;
  if (key) headers["X-Spark-Owner"] = key;
  return headers;
}

/* The game to show, in order of how directly it was handed to us. */
async function findProject() {
  // 1. handed over in the link, which is what the editor's 3D button does.
  //    This is the only source that works with no network at all.
  const inLink = /[#&]g=([A-Za-z0-9_-]+=*)/.exec(location.hash || "");
  if (inLink) {
    try {
      const json = decodeURIComponent(escape(atob(
        inLink[1].replace(/-/g, "+").replace(/_/g, "/"))));
      return [JSON.parse(json), "the editor"];
    } catch (err) { /* fall through to the next source */ }
  }
  // 2. asked for by name
  const named = /[?&]game=([^&#]+)/.exec(location.search || "");
  if (named) {
    const name = decodeURIComponent(named[1]);
    const got = await fetchJson("games/" + name + ".json");
    if (got) return [got, name];
  }
  // 3. whatever is in the games folder -- works on GitHub Pages too
  const index = await fetchJson("games/index.json");
  if (index && index.length) {
    const got = await fetchJson("games/" + index[0] + ".json");
    if (got) return [got, index[0]];
  }
  // 4. nothing reachable: the game baked into this file
  return [DEMO, "the built-in demo"];
}

async function fetchJson(path) {
  try {
    const res = await fetch(path, {headers: authHeaders()});
    if (!res.ok) return null;
    return await res.json();
  } catch (err) {
    return null;                 // no server, or a file:// page
  }
}

/* Is a Spark server there, with a game actually running? */
async function probeLive() {
  if (forcedLocal) return null;
  try {
    const res = await fetch("api/live", {headers: authHeaders()});
    if (!res.ok) return null;
    const snap = await res.json();
    return snap && snap.running && snap.w ? snap : null;
  } catch (err) {
    return null;
  }
}

function setSource(kind, text) {
  const badge = $("#source");
  badge.className = "badge " + kind;
  badge.textContent = text;
}

function startLocal() {
  live = false;
  liveSnapshot = null;
  world = new World(project, null);
  renderer.buildFloor(world.width, world.height);
  setSource("local", "RUNNING HERE");
  $("#mode").textContent = forcedLocal ? "go live" : "reload";
  if (stepTimer) clearInterval(stepTimer);
  const speed = Math.max(1, (project.world || {}).speed || 6);
  stepTimer = setInterval(localStep, 1000 / speed);
}

function localStep() {
  if (!world || world.status) return;
  world.keys = new Set(pressed);
  pressed.clear();                       // each press acts once, as in live.py
  world.step();
}

function startLive(snap) {
  live = true;
  liveSnapshot = snap;
  if (stepTimer) { clearInterval(stepTimer); stepTimer = null; }
  renderer.buildFloor(snap.w, snap.h);
  setSource("live", "LIVE");
  $("#mode").textContent = "run here";
}

async function poll() {
  const snap = await probeLive();
  if (snap) {
    if (!live || (liveSnapshot &&
        (liveSnapshot.w !== snap.w || liveSnapshot.h !== snap.h))) startLive(snap);
    else liveSnapshot = snap;
    if (pressed.size) {
      const keys = [...pressed];
      pressed.clear();
      fetch("api/key", {
        method: "POST",
        headers: {"Content-Type": "application/json", ...authHeaders()},
        body: JSON.stringify({keys}),
      }).catch(() => {});
    }
  } else if (live) {
    startLocal();                        // the server went away mid-game
  }
}

/* What the renderer draws, whichever source is feeding us. */
function currentThings() {
  if (live && liveSnapshot) {
    return (liveSnapshot.things || []).map(([x, y, glyph, color]) =>
      ({x, y, glyph, color, kind: "", role: "prop", solid: false}));
  }
  return world ? world.things : [];
}

function currentHud() {
  if (live && liveSnapshot) {
    const you = liveSnapshot.you || {};
    return {score: liveSnapshot.score, tick: liveSnapshot.tick,
            health: you.health, message: liveSnapshot.message,
            status: liveSnapshot.status, name: liveSnapshot.game};
  }
  if (!world) return null;
  const player = world.things.find(t => t.role === "player");
  return {score: world.score, tick: world.tick,
          health: player ? player.health : null, message: world.message,
          status: world.status, name: project.name};
}

// -- the frame -------------------------------------------------------------
const labelPool = [];

function frame() {
  const things = currentThings();
  // The camera orbits around you, not a fixed spot over the board -- so the
  // world reads as the place you are standing in, not a box seen from
  // outside. yaw/pitch/dist stay exactly what your swipe and pinch left them.
  const me = things.find(t => t.role === "player") || things[0];
  if (me) {
    renderer.centre[0] = me.x + 0.5;
    renderer.centre[1] = 0.9 + (me.z || 0);
    renderer.centre[2] = me.y + 0.5;
  }
  renderer.buildThings(things);
  renderer.draw();
  drawGlyphs(things);
  drawHud();
  drawCompass();
  drawSelection();
  requestAnimationFrame(frame);
}

/* A meter, not a dial: the tape is built once, spanning far more than a
 * full turn each way, and the whole thing just slides sideways under a
 * fixed centre marker as the camera's yaw changes. Not a real-world
 * heading, just this world's own yaw=0 called "north".
 *
 * Built wide (8 full turns each direction) rather than regenerated every
 * frame, because sliding one already-built strip is one style write; the
 * only reason it is wide at all is so spinning the camera several times
 * over never scrolls it out of ticks -- an ordinary swipe never gets
 * anywhere close to the edge of it. */
const COMPASS_PX_PER_DEG = 4;
const COMPASS_NAMES = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

function setupCompass() {
  const tape = $("#compass-tape");
  const span = 8 * 360;
  for (let deg = -span; deg <= span; deg += 15) {
    const tick = document.createElement("div");
    const wrapped = ((deg % 360) + 360) % 360;
    const isMajor = wrapped % 45 === 0;
    tick.className = "compass-tick " + (isMajor ? "major" : "minor");
    if (isMajor) {
      const name = COMPASS_NAMES[wrapped / 45];
      tick.textContent = name;
      if (name === "N") tick.classList.add("north");
    }
    tick.style.left = (deg * COMPASS_PX_PER_DEG) + "px";
    tape.appendChild(tick);
  }
}

function drawCompass() {
  const deg = renderer.yaw * 180 / Math.PI;
  $("#compass-tape").style.transform = `translateX(${-deg * COMPASS_PX_PER_DEG}px)`;
}

function drawGlyphs(things) {
  const box = $("#labels");
  while (labelPool.length < things.length) {
    const node = document.createElement("div");
    node.className = "glyph";
    box.appendChild(node);
    labelPool.push(node);
  }
  things.forEach((thing, i) => {
    const node = labelPool[i];
    const shot = thing.kind === "shot";
    const top = (shot ? 0.4 : (thing.role === "player" ? 1.2 : 0.85)) + (thing.z || 0);
    const at = renderer.project(thing.x + 0.5, top, thing.y + 0.5);
    if (!at) { node.style.display = "none"; return; }
    node.style.display = "";
    node.style.left = at[0] + "px";
    node.style.top = at[1] + "px";
    node.style.color = COLOR_CSS[thing.color] || COLOR_CSS.white;
    if (node.textContent !== thing.glyph) node.textContent = thing.glyph;
  });
  for (let i = things.length; i < labelPool.length; i++)
    labelPool[i].style.display = "none";
}

function drawHud() {
  const hud = currentHud();
  if (!hud) return;
  const bits = ["score <b>" + hud.score + "</b>", "tick <b>" + hud.tick + "</b>"];
  if (hud.health !== null && hud.health !== undefined)
    bits.splice(1, 0, "health <b>" + hud.health + "</b>");
  $("#hud").innerHTML = bits.join("<br>");
  $("#title").textContent = hud.name || "Spark 3D";
  $("#say").textContent = hud.status
    ? (hud.status === "win" ? "YOU WON" : "YOU LOST")
    : (hud.message || "");
}

// -- touch: one finger turns the camera, two pinch it ----------------------
// rend defaults to the main game renderer, so every existing call site
// (just bindCamera($("#gl"))) still targets it exactly as before; the mesh
// creator's own preview canvas passes its own renderer instead.
function bindCamera(canvas, rend, minDist, maxDist) {
  const touches = new Map();
  let lastPinch = null;
  const lo = minDist || MIN_DIST, hi = maxDist || MAX_DIST;

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, [e.clientX, e.clientY]);
  });

  canvas.addEventListener("pointermove", e => {
    if (!touches.has(e.pointerId)) return;
    const last = touches.get(e.pointerId);
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    const r = rend || renderer;

    if (touches.size === 1) {
      r.yaw -= (e.clientX - last[0]) * 0.008;
      r.pitch += (e.clientY - last[1]) * 0.006;
      r.pitch = Math.max(0.18, Math.min(1.5, r.pitch));
    } else if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const gap = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastPinch) r.dist *= lastPinch / Math.max(1, gap);
      r.dist = Math.max(lo, Math.min(hi, r.dist));
      lastPinch = gap;
    }
  });

  const drop = e => {
    touches.delete(e.pointerId);
    if (touches.size < 2) lastPinch = null;
  };
  canvas.addEventListener("pointerup", drop);
  canvas.addEventListener("pointercancel", drop);

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const r = rend || renderer;
    r.dist = Math.max(lo, Math.min(hi, r.dist * (1 + e.deltaY * 0.001)));
  }, {passive: false});
}

function bindControls() {
  for (const button of document.querySelectorAll("#pad button[data-key]")) {
    // Not while the button editor has this one -- a drag there must not
    // also move the character or fire an action.
    const press = e => {
      if (editingButtons) return;
      e.preventDefault();
      pressed.add(button.dataset.key);
    };
    button.addEventListener("pointerdown", press);
  }
  const named = {ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left",
                 ArrowRight: "right", " ": "space"};
  document.addEventListener("keydown", e => {
    const key = named[e.key] || (/^[wasdef]$/i.test(e.key) ? e.key.toLowerCase() : null);
    if (key) { pressed.add(key); e.preventDefault(); }
  });

  // Same idea for the side bar's plain onclick buttons: while editing,
  // swallow the click before restart/save/etc. ever see it. Capture phase,
  // so this runs before any button's own onclick.
  document.addEventListener("click", e => {
    if (editingButtons && e.target.closest("[data-editable]")) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  }, true);

  setupButtonEditor();

  $("#restart").onclick = () => {
    if (live) return;
    startLocal();
  };
  $("#recentre").onclick = () => {
    renderer.yaw = 0; renderer.pitch = 0.86;
    renderer.frameBoard();          // re-fitted to the screen as it is now
  };
  $("#save").onclick = saveWorld;
  $("#save-as").onclick = saveWorldAs;
  $("#fullscreen").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener("fullscreenchange", () => {
    $("#fullscreen").textContent = document.fullscreenElement ? "⛝" : "⛶";
  });
  $("#mode").onclick = async () => {
    forcedLocal = !forcedLocal;
    if (forcedLocal) startLocal();
    else {
      const snap = await probeLive();
      if (snap) startLive(snap); else startLocal();
    }
  };
}

/* ---------------------------------------------------------------------
 * Button editor -- select, drag, resize, fade any button, including a
 * button drawer's own bubbles (registered as each is built, since the
 * drawer rebuilds its DOM on every add/remove/select). Position/size/
 * opacity are per-viewer preferences, not game data, so they live in
 * localStorage rather than the saved world file. The list exists because
 * a button dragged off-screen or faded to invisible would otherwise be
 * impossible to tap and fix again.
 * ------------------------------------------------------------------- */
const BUTTON_LAYOUT_KEY = "spark3d-button-layout";

function loadButtonLayout() {
  try { return JSON.parse(localStorage.getItem(BUTTON_LAYOUT_KEY) || "{}"); }
  catch (err) { return {}; }
}
const buttonLayout = loadButtonLayout();
function saveButtonLayout() {
  try { localStorage.setItem(BUTTON_LAYOUT_KEY, JSON.stringify(buttonLayout)); }
  catch (err) { /* private mode or storage full -- edits just won't stick */ }
}

// Named snapshots of the whole layout, separate from buttonLayout itself
// (which is always the one "live" arrangement) -- save one under a name,
// reload it later, switch between a few without losing any of them.
const BUTTON_LAYOUT_SAVES_KEY = "spark3d-button-layout-saves";
function loadLayoutSaves() {
  try { return JSON.parse(localStorage.getItem(BUTTON_LAYOUT_SAVES_KEY) || "{}"); }
  catch (err) { return {}; }
}
const layoutSaves = loadLayoutSaves();
function saveLayoutSaves() {
  try { localStorage.setItem(BUTTON_LAYOUT_SAVES_KEY, JSON.stringify(layoutSaves)); }
  catch (err) { /* private mode or storage full -- edits just won't stick */ }
}

function renderLayoutList() {
  const box = $("#edit-layout-list");
  box.innerHTML = "";
  const names = Object.keys(layoutSaves);
  if (!names.length) {
    const empty = document.createElement("div");
    empty.className = "edit-list-row";
    empty.style.cursor = "default";
    empty.textContent = "(no saved layouts yet)";
    box.appendChild(empty);
    return;
  }
  for (const name of names) {
    const row = document.createElement("div");
    row.className = "edit-list-row layout-row";
    const label = document.createElement("span");
    label.className = "layout-name";
    label.textContent = name;
    label.title = "load this layout";
    label.onclick = () => loadButtonLayoutByName(name);
    const del = document.createElement("span");
    del.className = "layout-del";
    del.textContent = "×";
    del.title = "delete this saved layout";
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm('Delete the saved layout "' + name + '"? This cannot be undone.')) return;
      delete layoutSaves[name];
      saveLayoutSaves();
      renderLayoutList();
    };
    row.append(label, del);
    box.appendChild(row);
  }
}

function saveCurrentLayoutAs(name) {
  layoutSaves[name] = JSON.parse(JSON.stringify(buttonLayout));   // a real snapshot, not a live reference
  saveLayoutSaves();
  renderLayoutList();
}

function loadButtonLayoutByName(name) {
  const snap = layoutSaves[name];
  if (!snap) return;
  for (const key of Object.keys(buttonLayout)) delete buttonLayout[key];
  Object.assign(buttonLayout, snap);
  for (const {el} of editableButtons.values()) {
    const uid = el.dataset.uid;
    if (buttonLayout[uid]) applyButtonStyle(el, buttonLayout[uid]);
    else { el.style.transform = ""; el.style.opacity = ""; }
  }
  saveButtonLayout();
  selectEditable(null);
  drawerToast('loaded "' + name + '"');
}

function applyButtonStyle(btn, entry) {
  const dx = entry.dx || 0, dy = entry.dy || 0;
  const scale = entry.scale || 1;
  const opacity = entry.opacity === undefined ? 1 : entry.opacity;
  btn.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
  btn.style.opacity = String(opacity);
}

// uid -> {el, label}. Every currently-existing editable button, kept in
// sync as the drawer adds/removes/rebuilds its own -- see registerEditable.
const editableButtons = new Map();
let editSelected = null;      // uid, or null
let editDragging = null;      // {uid, x, y, dx, dy}, or null
let gridLockOn = false;       // dragging (and "go to x%, y%") snap to a grid

// The grid size input is read live rather than cached, so typing a new
// size takes effect immediately without a separate "apply" step.
const currentGridSize = () => Math.max(0.5, parseFloat($("#edit-grid-size").value) || 5);
const snapVal = v => gridLockOn ? Math.round(v / currentGridSize()) * currentGridSize() : v;

function updateGridOverlay() {
  const overlay = $("#edit-grid-overlay");
  overlay.classList.toggle("on", editingButtons && gridLockOn);
  const size = currentGridSize() + "%";
  overlay.style.backgroundSize = size + " " + size;
}

// After a drag moves a button, nudge it the rest of the way to the
// nearest grid intersection -- same "measure the real rect, work out how
// far off target that is, add the difference to dx/dy" approach as
// "go to x%, y%", just run continuously while dragging instead of once.
function snapElementToGrid(el, entry) {
  if (!gridLockOn) return;
  const pos = currentPercent(el);
  const targetXPercent = snapVal(pos.x), targetYPercent = snapVal(pos.y);
  const rect = el.getBoundingClientRect();
  const w = window.innerWidth || 1, h = window.innerHeight || 1;
  entry.dx += (targetXPercent / 100) * w - (rect.left + rect.width / 2);
  entry.dy += (targetYPercent / 100) * h - (rect.top + rect.height / 2);
  applyButtonStyle(el, entry);
}

// Where a button's centre is right now, as a decimal percent of the whole
// screen -- 0,0 top-left corner, 100,100 bottom-right. Reads the actual
// rendered box (getBoundingClientRect), so it is correct regardless of
// whatever drag/scale is already applied.
function currentPercent(el) {
  const rect = el.getBoundingClientRect();
  const w = window.innerWidth || 1, h = window.innerHeight || 1;
  const x = ((rect.left + rect.width / 2) / w) * 100;
  const y = ((rect.top + rect.height / 2) / h) * 100;
  // A number input shows nothing at all for NaN rather than "NaN" or the
  // last value -- round() of a bad rect would otherwise leave the box
  // silently blank instead of a visible, obviously-wrong 0.
  return {
    x: Number.isFinite(x) ? Math.round(x * 10) / 10 : 0,
    y: Number.isFinite(y) ? Math.round(y * 10) / 10 : 0,
  };
}

function selectEditable(uid) {
  if (editSelected && editableButtons.has(editSelected)) {
    editableButtons.get(editSelected).el.classList.remove("edit-selected");
  }
  editSelected = uid;
  if (uid && editableButtons.has(uid)) {
    const entry = buttonLayout[uid] || {};
    const el = editableButtons.get(uid).el;
    el.classList.add("edit-selected");
    const size = Math.round((entry.scale || 1) * 1000) / 10;      // e.g. 87.5
    const opacity = Math.round((entry.opacity === undefined ? 1 : entry.opacity) * 1000) / 10;
    $("#edit-size").value = size;
    $("#edit-size-num").value = size;
    $("#edit-opacity").value = opacity;
    $("#edit-opacity-num").value = opacity;
    const pos = currentPercent(el);
    $("#edit-x").value = pos.x;
    $("#edit-y").value = pos.y;
  }
  renderEditList();
}

function renderEditList() {
  const box = $("#edit-list");
  box.innerHTML = "";
  for (const [uid, {el, label}] of editableButtons) {
    const row = document.createElement("div");
    row.className = "edit-list-row" + (uid === editSelected ? " on" : "");
    row.textContent = (el.textContent || "□").trim() + "  " + (label || uid);
    row.onclick = () => selectEditable(uid);
    box.appendChild(row);
  }
}

/* Called once for the pad/side buttons at startup, and again every time
 * the button drawer rebuilds one of its own -- re-registering an existing
 * uid just points it at the new element and re-applies whatever was saved
 * for it, so a drawer bubble keeps its custom size/position/fade across
 * every re-render instead of losing it the moment the drawer redraws. */
function registerEditable(el, uid, label) {
  el.dataset.editable = "";
  el.dataset.uid = uid;
  editableButtons.set(uid, {el, label});
  if (buttonLayout[uid]) applyButtonStyle(el, buttonLayout[uid]);
  if (uid === editSelected) el.classList.add("edit-selected");

  el.addEventListener("pointerdown", e => {
    if (!editingButtons) return;
    e.preventDefault();
    e.stopPropagation();
    selectEditable(uid);
    const entry = buttonLayout[uid] || (buttonLayout[uid] = {});
    editDragging = {uid, x: e.clientX, y: e.clientY, dx: entry.dx || 0, dy: entry.dy || 0};
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!editDragging || editDragging.uid !== uid) return;
    const entry = buttonLayout[uid];
    entry.dx = editDragging.dx + (e.clientX - editDragging.x);
    entry.dy = editDragging.dy + (e.clientY - editDragging.y);
    applyButtonStyle(el, entry);
    snapElementToGrid(el, entry);
  });
  const endDrag = () => {
    if (!editDragging || editDragging.uid !== uid) return;
    editDragging = null;
    saveButtonLayout();
  };
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);

  if (editingButtons) renderEditList();
}

function setupButtonEditor() {
  for (const el of document.querySelectorAll("[data-editable]")) {
    registerEditable(el, el.id || el.dataset.key, el.title || el.getAttribute("aria-label"));
  }

  // Slider and typed number for the same property stay in sync either
  // direction -- move one, the other updates to match, and either can
  // apply. Decimal precision throughout: sliders step by 0.1 too, not
  // whole percent.
  function applySizeOpacity(size, opacity) {
    if (!editSelected) return;
    const entry = buttonLayout[editSelected] || (buttonLayout[editSelected] = {});
    entry.scale = size / 100;
    entry.opacity = opacity / 100;
    applyButtonStyle(editableButtons.get(editSelected).el, entry);
    saveButtonLayout();
  }
  $("#edit-size").addEventListener("input", () => {
    $("#edit-size-num").value = $("#edit-size").value;
    applySizeOpacity($("#edit-size").value, $("#edit-opacity").value);
  });
  $("#edit-size-num").addEventListener("input", () => {
    $("#edit-size").value = $("#edit-size-num").value;
    applySizeOpacity($("#edit-size-num").value, $("#edit-opacity").value);
  });
  $("#edit-opacity").addEventListener("input", () => {
    $("#edit-opacity-num").value = $("#edit-opacity").value;
    applySizeOpacity($("#edit-size").value, $("#edit-opacity").value);
  });
  $("#edit-opacity-num").addEventListener("input", () => {
    $("#edit-opacity").value = $("#edit-opacity-num").value;
    applySizeOpacity($("#edit-size").value, $("#edit-opacity-num").value);
  });

  // Typed exact position: move the button so its centre lands at that
  // decimal percent of the screen, whatever position it is at now.
  $("#edit-goto-xy").onclick = () => {
    if (!editSelected) return;
    const el = editableButtons.get(editSelected).el;
    const entry = buttonLayout[editSelected] || (buttonLayout[editSelected] = {});
    const xPercent = snapVal(Math.max(0, Math.min(100, parseFloat($("#edit-x").value) || 0)));
    const yPercent = snapVal(Math.max(0, Math.min(100, parseFloat($("#edit-y").value) || 0)));
    const rect = el.getBoundingClientRect();
    const curCentreX = rect.left + rect.width / 2;
    const curCentreY = rect.top + rect.height / 2;
    const targetX = (xPercent / 100) * window.innerWidth;
    const targetY = (yPercent / 100) * window.innerHeight;
    entry.dx = (entry.dx || 0) + (targetX - curCentreX);
    entry.dy = (entry.dy || 0) + (targetY - curCentreY);
    applyButtonStyle(el, entry);
    saveButtonLayout();
    const pos = currentPercent(el);   // read back the real result, not just echo the typed numbers
    $("#edit-x").value = pos.x;
    $("#edit-y").value = pos.y;
  };

  $("#edit-reset").onclick = () => {
    if (!editSelected) return;
    delete buttonLayout[editSelected];
    const el = editableButtons.get(editSelected).el;
    el.style.transform = "";
    el.style.opacity = "";
    saveButtonLayout();
    selectEditable(editSelected);   // sliders back to their defaults
  };

  $("#edit-reset-all").onclick = () => {
    if (!confirm("Reset every button back to its default size, position, "
                + "and opacity? This cannot be undone.")) return;
    for (const key of Object.keys(buttonLayout)) delete buttonLayout[key];
    for (const {el} of editableButtons.values()) {
      el.style.transform = "";
      el.style.opacity = "";
    }
    saveButtonLayout();
    selectEditable(null);   // clears the selection and sliders too
  };

  $("#edit-toggle").onclick = () => {
    editingButtons = !editingButtons;
    document.body.classList.toggle("editing-buttons", editingButtons);
    $("#edit-toggle").textContent = editingButtons ? "✓" : "✎";
    $("#edit-panel").classList.toggle("on", editingButtons);
    updateGridOverlay();
    if (editingButtons) { renderEditList(); renderLayoutList(); }
    else selectEditable(null);
  };

  $("#edit-grid-on").addEventListener("change", () => {
    gridLockOn = $("#edit-grid-on").checked;
    syncGridLockDisplays();   // keeps the Properties toggle matching too
  });
  $("#edit-grid-size").addEventListener("input", updateGridOverlay);

  $("#edit-save-layout").onclick = () => {
    const name = (prompt("Save the current button layout as:", "layout 1") || "").trim();
    if (!name) return;
    if (layoutSaves[name] && !confirm('"' + name + '" already exists. Overwrite it?')) return;
    saveCurrentLayoutAs(name);
  };
}

/* Turns whatever is alive right now into a project file: each character
 * kind keeps its template (brain, glyph, shape, ...) but its `count` becomes
 * how many of that kind are alive this instant, so a barren world you built
 * up with the spawn/shape/resize buttons saves back out the way it looks. */
function buildSaveProject() {
  const counts = {};
  for (const thing of world.things) {
    if (thing.alive) counts[thing.kind] = (counts[thing.kind] || 0) + 1;
  }
  const characters = Object.keys(world.templates)
    .filter(kind => kind !== "shot")   // added on the fly, not a real tile
    .map(kind => ({...world.templates[kind], kind, count: counts[kind] || 0}));
  return {
    name: (project && project.name) || "barren",
    world: {width: world.width, height: world.height, wrap: world.wrap,
            speed: (project && project.world && project.world.speed) || 6},
    characters,
    tiles: (project && project.tiles) || [],
  };
}

/* Names this session has already agreed to (over)write -- once a name is
 * confirmed, quick-saving back to it again does not nag a second time,
 * same as any editor's plain "Save" not re-asking every keystroke. */
const confirmedNames = new Set();

/* null means "couldn't check" (no server reachable), not "not taken" --
 * callers must not treat null as a green light. */
async function nameTaken(name) {
  try {
    const res = await fetch("api/game?name=" + encodeURIComponent(name),
                            {headers: authHeaders()});
    return res.ok;
  } catch (err) {
    return null;
  }
}

async function writeSave(name) {
  const safe = name.replace(/[^A-Za-z0-9 _-]/g, "").trim();
  if (!safe) { window.alert("give it a name"); return; }

  if (!confirmedNames.has(safe)) {
    const taken = await nameTaken(safe);
    if (taken) {
      const overwrite = window.confirm(
        "A 3D world named \"" + safe + "\" already exists.\n\n" +
        "Overwrite it? This cannot be undone.");
      if (!overwrite) return;   // blocked -- pick a different name and try again
    }
    confirmedNames.add(safe);
  }

  const proj = buildSaveProject();
  proj.name = safe;

  try {
    const res = await fetch("api/game", {method: "POST",
      headers: {"Content-Type": "application/json", ...authHeaders()},
      body: JSON.stringify(proj)});
    if (res.ok) {
      lastSaveName = safe;
      window.alert("saved as games/" + safe + ".json");
      return;
    }
  } catch (err) { /* no server reachable -- fall through to a download */ }

  const blob = new Blob([JSON.stringify(proj, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = safe + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  lastSaveName = safe;
}

/* "save": writes straight back over whatever this world was last saved or
 * loaded as, no prompt -- unless nothing like that exists yet, in which
 * case there is nothing to overwrite and it falls back to asking. */
async function saveWorld() {
  if (lastSaveName) { await writeSave(lastSaveName); return; }
  await saveWorldAs();
}

/* "save as new": always asks for a name, so a copy can be forked off
 * without touching the file this world came from. */
async function saveWorldAs() {
  const name = window.prompt("Save this world as a new 3D world file:",
                              buildSaveProject().name);
  if (!name) return;
  await writeSave(name);
}

/* ---------------------------------------------------------------------
 * Button Drawer -- a row of round buttons that slides out from a screen
 * edge, floating translucent over the world instead of a separate panel.
 * Full write-up (including the built-in select/add/remove controls) lives
 * in ~/bubble-drawer/README.md; this is the same component, restyled to
 * match the pad instead of carrying its own colors.
 * ------------------------------------------------------------------- */
function drawerToast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;bottom:14%;transform:translateX(-50%);"
    + "background:rgba(74,80,88,.92);color:#f2f4f6;border:1px solid #838a94;"
    + "border-radius:10px;padding:8px 14px;z-index:99;font-size:13px";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1200);
}

/* ---------------------------------------------------------------------
 * Backpack -- a small virtual file system: folders and files, browsed and
 * edited the way Windows Explorer's New folder / New item / Delete work.
 * It is a per-viewer thing (localStorage), not game data -- what you keep
 * in it has nothing to do with any one world file.
 * ------------------------------------------------------------------- */
const BACKPACK_KEY = "spark3d-backpack";

function loadBackpack() {
  try {
    const saved = JSON.parse(localStorage.getItem(BACKPACK_KEY));
    if (saved && saved.children) return saved;
  } catch (err) { /* fall through to a fresh one */ }
  return {name: "Backpack", type: "folder", children: [
    {name: "buttons", type: "folder", children: []},
    {name: "backpack", type: "folder", children: []},
  ]};
}
function saveBackpack() {
  try { localStorage.setItem(BACKPACK_KEY, JSON.stringify(backpackRoot)); }
  catch (err) { /* private mode or storage full -- edits just won't stick */ }
}

const backpackRoot = loadBackpack();
let backpackPath = [backpackRoot];   // the folders navigated into, root first
let backpackSelected = null;         // a child of the current folder, or null

const currentBackpackFolder = () => backpackPath[backpackPath.length - 1];

function renderBackpack() {
  const folder = currentBackpackFolder();

  const pathEl = $("#backpack-path");
  pathEl.innerHTML = "";
  backpackPath.forEach((node, i) => {
    if (i > 0) pathEl.appendChild(document.createTextNode(" › "));
    const seg = document.createElement("span");
    seg.className = "bp-crumb";
    seg.textContent = node.name;
    seg.onclick = () => {
      backpackPath = backpackPath.slice(0, i + 1);
      backpackSelected = null;
      renderBackpack();
    };
    pathEl.appendChild(seg);
  });

  const grid = $("#backpack-grid");
  grid.innerHTML = "";
  if (!folder.children.length) {
    const empty = document.createElement("div");
    empty.className = "bp-empty";
    empty.textContent = "This folder is empty.";
    grid.appendChild(empty);
  }
  for (const node of folder.children) {
    const item = document.createElement("div");
    item.className = "bp-item" + (node === backpackSelected ? " on" : "");
    const icon = document.createElement("div");
    icon.className = "bp-icon";
    icon.textContent = node.type === "folder" ? "\u{1F4C1}" : "\u{1F4C4}";
    const label = document.createElement("div");
    label.className = "bp-label";
    label.textContent = node.name;
    item.append(icon, label);
    item.onclick = () => {
      if (node.type === "folder") {
        backpackPath = [...backpackPath, node];
        backpackSelected = null;
      } else {
        backpackSelected = backpackSelected === node ? null : node;
      }
      renderBackpack();
    };
    grid.appendChild(item);
  }

  $("#bp-up").disabled = backpackPath.length <= 1;
  $("#bp-delete").disabled = !backpackSelected;
}

function backpackNewFolder() {
  const name = (prompt("New folder name:", "New folder") || "").trim();
  if (!name) return;
  currentBackpackFolder().children.push({name, type: "folder", children: []});
  saveBackpack();
  renderBackpack();
}
function backpackNewFile() {
  const name = (prompt("New item name:", "New item") || "").trim();
  if (!name) return;
  currentBackpackFolder().children.push({name, type: "file"});
  saveBackpack();
  renderBackpack();
}
function backpackDelete() {
  if (!backpackSelected) return;
  const what = backpackSelected.type === "folder"
    ? `"${backpackSelected.name}" and everything in it` : `"${backpackSelected.name}"`;
  if (!confirm(`Delete ${what}? This cannot be undone.`)) return;
  const folder = currentBackpackFolder();
  folder.children = folder.children.filter(n => n !== backpackSelected);
  backpackSelected = null;
  saveBackpack();
  renderBackpack();
}
function backpackUp() {
  if (backpackPath.length <= 1) return;
  backpackPath = backpackPath.slice(0, -1);
  backpackSelected = null;
  renderBackpack();
}

function setupBackpack() {
  $("#backpack-toggle").onclick = () => {
    if (editingButtons) return;   // the button editor owns taps for now
    backpackPath = [backpackRoot];
    backpackSelected = null;
    renderBackpack();
    $("#backpack-modal").classList.add("on");
  };
  $("#backpack-close").onclick = () => $("#backpack-modal").classList.remove("on");
  $("#bp-up").onclick = backpackUp;
  $("#bp-new-folder").onclick = backpackNewFolder;
  $("#bp-new-file").onclick = backpackNewFile;
  $("#bp-delete").onclick = backpackDelete;
}

/* ---------------------------------------------------------------------
 * Properties -- near-fullscreen panel listing grid-lock movement (synced
 * with the same toggle in the button editor, either one flips both) and
 * a clock derived from the world's own tick count and speed, not a real
 * clock -- ticks / (ticks per second) = elapsed seconds since the world
 * started.
 * ------------------------------------------------------------------- */
function worldClockText() {
  const hud = currentHud();
  const tick = hud ? hud.tick : 0;
  const speed = (project && project.world && project.world.speed) || 6;
  const totalSeconds = Math.floor(tick / speed);
  const pad = n => String(n).padStart(2, "0");
  return pad(Math.floor(totalSeconds / 3600)) + ":" +
         pad(Math.floor((totalSeconds % 3600) / 60)) + ":" +
         pad(totalSeconds % 60);
}

function syncGridLockDisplays() {
  $("#prop-gridlock-toggle").textContent = gridLockOn ? "ON" : "OFF";
  $("#prop-gridlock-toggle").classList.toggle("on", gridLockOn);
  $("#edit-grid-on").checked = gridLockOn;
  updateGridOverlay();
}

// Ticks per second -- the same number startLocal() already reads out of
// project.world.speed, just changeable while the game is running instead
// of only at the moment it (re)starts.
function setMoveSpeed(newSpeed) {
  const speed = Math.max(1, Math.min(30, Math.round(newSpeed) || 6));
  project.world = project.world || {};
  project.world.speed = speed;
  if (world && !live && stepTimer) {
    clearInterval(stepTimer);
    stepTimer = setInterval(localStep, 1000 / speed);
  }
  return speed;
}

function setupProperties() {
  $("#properties-toggle").onclick = () => {
    if (editingButtons) return;   // the button editor owns taps for now
    $("#prop-clock").textContent = worldClockText();
    syncGridLockDisplays();
    const speed = (project && project.world && project.world.speed) || 6;
    $("#prop-speed").value = speed;
    $("#prop-speed-num").value = speed;
    $("#properties-modal").classList.add("on");
  };
  $("#properties-close").onclick = () => $("#properties-modal").classList.remove("on");
  $("#prop-gridlock-toggle").onclick = () => {
    gridLockOn = !gridLockOn;
    syncGridLockDisplays();
  };
  $("#prop-speed").addEventListener("input", () => {
    const v = setMoveSpeed($("#prop-speed").value);
    $("#prop-speed-num").value = v;
  });
  $("#prop-speed-num").addEventListener("input", () => {
    const v = setMoveSpeed($("#prop-speed-num").value);
    $("#prop-speed").value = v;
  });
  // Only bothers updating the DOM while the panel is actually open.
  setInterval(() => {
    if ($("#properties-modal").classList.contains("on")) {
      $("#prop-clock").textContent = worldClockText();
    }
  }, 500);
}

/* ---------------------------------------------------------------------
 * Mesh Creator -- build a custom shape out of several cube/sphere parts,
 * each with its own offset, size, and colour, and save it as a new,
 * placeable kind. The preview is a second Renderer on its own canvas --
 * the exact same class the main 3D view uses, so what you see here is
 * exactly what gets placed, not an approximation of it.
 * ------------------------------------------------------------------- */
let meshParts = [];
let meshSelected = null;
let meshRenderer = null;
let meshLoopRunning = false;
let meshEditingKind = null;   // set while editing an existing saved mesh, so save overwrites it by default

function ensureMeshRenderer() {
  if (meshRenderer) return;
  meshRenderer = new Renderer($("#mesh-canvas"));
  meshRenderer.centre = [0.5, 0.35, 0.5];
  meshRenderer.yaw = 0.6; meshRenderer.pitch = 0.5; meshRenderer.dist = 2.2;
  meshRenderer.radius = 3;
  bindCamera($("#mesh-canvas"), meshRenderer, 1, 20);   // closer minimum zoom than the main view
}

function meshFrame() {
  if (!$("#mesh-modal").classList.contains("on")) { meshLoopRunning = false; return; }
  const fake = {kind: "preview", color: "white", parts: meshParts, ghost: false, x: 0, y: 0, z: 0};
  meshRenderer.buildThings(meshParts.length ? [fake] : []);
  meshRenderer.draw();
  requestAnimationFrame(meshFrame);
}

function renderMeshPartList() {
  const box = $("#mesh-part-list");
  box.innerHTML = "";
  if (!meshParts.length) {
    const empty = document.createElement("div");
    empty.className = "mesh-part-row";
    empty.style.cursor = "default";
    empty.textContent = "(no parts yet -- add one below)";
    box.appendChild(empty);
    return;
  }
  meshParts.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "mesh-part-row" + (i === meshSelected ? " on" : "");
    row.textContent = (p.shape || "cube") + " (" + (p.color || "white") + ")";
    row.onclick = () => selectMeshPart(i);
    box.appendChild(row);
  });
}

function selectMeshPart(i) {
  meshSelected = i;
  const p = meshParts[i];
  if (!p) return;
  $("#mesh-part-shape").value = p.shape || "cube";
  $("#mesh-part-color").value = p.color || "white";
  $("#mesh-part-dx").value = p.dx || 0;
  $("#mesh-part-dy").value = p.dy || 0;
  $("#mesh-part-dz").value = p.dz || 0;
  $("#mesh-part-sx").value = p.sx || 0.5;
  $("#mesh-part-sy").value = p.sy || 0.5;
  $("#mesh-part-sz").value = p.sz || 0.5;
  renderMeshPartList();
}

function applyMeshFieldsToSelected() {
  if (meshSelected === null || !meshParts[meshSelected]) return;
  const p = meshParts[meshSelected];
  p.shape = $("#mesh-part-shape").value;
  p.color = $("#mesh-part-color").value;
  p.dx = parseFloat($("#mesh-part-dx").value) || 0;
  p.dy = parseFloat($("#mesh-part-dy").value) || 0;
  p.dz = parseFloat($("#mesh-part-dz").value) || 0;
  p.sx = Math.max(0.05, parseFloat($("#mesh-part-sx").value) || 0.5);
  p.sy = Math.max(0.05, parseFloat($("#mesh-part-sy").value) || 0.5);
  p.sz = Math.max(0.05, parseFloat($("#mesh-part-sz").value) || 0.5);
  renderMeshPartList();
}

function refreshMeshLoadSelect() {
  const sel = $("#mesh-load-select");
  sel.innerHTML = '<option value="">— load an existing mesh to edit —</option>';
  if (!world) return;
  const withParts = Object.keys(world.templates)
    .filter(k => world.templates[k].parts && world.templates[k].parts.length)
    .sort((a, b) => a.localeCompare(b));
  for (const kind of withParts) {
    const opt = document.createElement("option");
    opt.value = kind; opt.textContent = kind;
    sel.appendChild(opt);
  }
}

function loadMeshForEditing(kind) {
  const template = world && world.templates[kind];
  if (!template || !template.parts) return;
  meshParts = JSON.parse(JSON.stringify(template.parts));
  meshEditingKind = kind;
  meshSelected = meshParts.length ? 0 : null;
  renderMeshPartList();
  if (meshSelected !== null) selectMeshPart(0);
  drawerToast('editing "' + kind + '"');
}

function openMeshCreator() {
  ensureMeshRenderer();
  renderMeshPartList();
  refreshMeshLoadSelect();
  $("#mesh-modal").classList.add("on");
  if (!meshLoopRunning) { meshLoopRunning = true; meshFrame(); }
}

function setupMeshCreator() {
  const colorSelect = $("#mesh-part-color");
  for (const name of Object.keys(COLOR_RGB)) {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    colorSelect.appendChild(opt);
  }

  $("#mesh-add-part").onclick = () => {
    meshParts.push({shape: "cube", dx: 0, dy: 0, dz: 0, sx: 0.5, sy: 0.5, sz: 0.5, color: "white"});
    selectMeshPart(meshParts.length - 1);
  };
  $("#mesh-delete-part").onclick = () => {
    if (meshSelected === null) return;
    meshParts.splice(meshSelected, 1);
    meshSelected = meshParts.length ? Math.min(meshSelected, meshParts.length - 1) : null;
    if (meshSelected !== null) selectMeshPart(meshSelected); else renderMeshPartList();
  };
  $("#mesh-new").onclick = () => {
    if (meshParts.length && !confirm("Clear the current mesh and start a new one?")) return;
    meshParts = []; meshSelected = null; meshEditingKind = null;
    $("#mesh-load-select").value = "";
    renderMeshPartList();
  };
  $("#mesh-load-btn").onclick = () => {
    const kind = $("#mesh-load-select").value;
    if (!kind) return;
    if (meshParts.length && !confirm('Replace the current mesh with "' + kind + '"?')) {
      $("#mesh-load-select").value = "";
      return;
    }
    loadMeshForEditing(kind);
  };
  for (const id of ["mesh-part-shape", "mesh-part-color", "mesh-part-dx", "mesh-part-dy",
                     "mesh-part-dz", "mesh-part-sx", "mesh-part-sy", "mesh-part-sz"]) {
    $("#" + id).addEventListener("input", applyMeshFieldsToSelected);
    $("#" + id).addEventListener("change", applyMeshFieldsToSelected);
  }

  $("#mesh-save").onclick = () => {
    if (!meshParts.length) { window.alert("add at least one part first"); return; }
    const existing = meshEditingKind && world && world.templates[meshEditingKind];
    const name = (prompt("Save this mesh as a kind named:",
                          meshEditingKind || "mymesh") || "").trim();
    if (!name) return;
    const safe = name.replace(/[^A-Za-z0-9_-]/g, "");
    if (!safe) { window.alert("give it a name"); return; }
    const glyphDefault = (existing && existing.glyph) || safe[0].toUpperCase();
    const glyph = (prompt("One-letter glyph for it:", glyphDefault) || glyphDefault).slice(0, 1);
    const template = {
      kind: safe, glyph, color: meshParts[0].color || "white", health: 1,
      count: 0, solid: true, role: "prop",
      parts: JSON.parse(JSON.stringify(meshParts)), brain: [],
    };
    // both places a template can live: the project (so it round-trips
    // through save/load) and the live world (so it is placeable this
    // instant, with no restart needed).
    if (project && project.characters) {
      const idx = project.characters.findIndex(c => c.kind === safe);
      if (idx >= 0) project.characters[idx] = template; else project.characters.push(template);
    }
    if (world) world.templates[safe] = template;
    meshEditingKind = safe;
    drawerToast('saved "' + safe + '" -- pick it in 🎨 Build');
    $("#mesh-modal").classList.remove("on");
  };

  $("#mesh-close").onclick = () => $("#mesh-modal").classList.remove("on");
}

/* ---------------------------------------------------------------------
 * Build mode / palette -- pick which kind the place tile adds next.
 *
 * Local play only: world.memory.palette_kind is set here by writing
 * straight to the live JS World object, which only exists for the copy
 * of the game running in this browser tab. A LIVE game (mirrored from a
 * real Termux server) has no such object to write into, so the palette
 * has nothing to affect there and place quietly keeps using whatever
 * kind its own tile says (see the "place" action).
 * ------------------------------------------------------------------- */
function renderPaletteList() {
  const box = $("#palette-list");
  box.innerHTML = "";
  if (!world) {
    box.textContent = "Not available in LIVE mode -- switch to \"run here\" first.";
    return;
  }
  const current = world.memory.palette_kind;
  const query = ($("#palette-search").value || "").trim().toLowerCase();
  const kinds = Object.keys(world.templates)
    .filter(k => k !== "shot")
    .filter(k => !query || k.toLowerCase().includes(query))
    .sort((a, b) => a.localeCompare(b));
  if (!kinds.length) {
    const empty = document.createElement("div");
    empty.className = "palette-item";
    empty.style.cursor = "default";
    empty.textContent = query ? "(nothing matches \"" + query + "\")" : "(nothing to place yet)";
    box.appendChild(empty);
    return;
  }
  for (const kind of kinds) {
    const row = document.createElement("div");
    row.className = "palette-item" + (kind === current ? " on" : "");
    row.textContent = kind;
    row.onclick = () => {
      world.memory.palette_kind = kind;
      drawerToast('now placing "' + kind + '"');
      renderPaletteList();
    };
    box.appendChild(row);
  }
}

function openPalette() {
  renderPaletteList();
  $("#palette-modal").classList.add("on");
}

function setupPalette() {
  $("#palette-close").onclick = () => $("#palette-modal").classList.remove("on");
  $("#palette-mesh-creator").onclick = () => {
    $("#palette-modal").classList.remove("on");
    openMeshCreator();
  };
  $("#palette-search").addEventListener("input", renderPaletteList);
}

/* ---------------------------------------------------------------------
 * Object Inspector -- colour, resize, and relocate whatever you're
 * touching, or your pending ghost if you have one (so a newly-spawned
 * object can be set up before it's even confirmed). Local play only,
 * same reasoning as Build mode: it writes straight into the live Thing
 * instance, which only exists for the copy of the game in this tab.
 * ------------------------------------------------------------------- */
let inspectTarget = null;

function findPlayer() {
  return world && world.things.find(t => t.role === "player");
}

// A pending ghost first (the "as I'm spawning one" case), else whatever
// is within one square -- the same reach the touch sensor itself uses.
function findInspectTarget() {
  const player = findPlayer();
  if (!player) return null;
  const ghost = world.things.find(t => t.alive && t.ghost && t.owner === player);
  if (ghost) return ghost;
  return world.things.find(t => t.alive && t !== player &&
    Math.max(Math.abs(t.x - player.x), Math.abs(t.y - player.y)) <= 1) || null;
}

/* Tap any object in the 3D view to pick it -- projects every thing to
 * screen space the exact same way a glyph label already is, and takes
 * whichever one lands closest to the tap, within a comfortable fingertip
 * radius. A cheap stand-in for real ray-casting that costs nothing extra:
 * the projection math already runs every frame for the glyphs anyway. */
function pickObjectAt(sx, sy) {
  if (!world) return;
  const player = findPlayer();
  let best = null, bestDist = 44;
  for (const t of world.things) {
    if (!t.alive || t === player) continue;
    const top = (t.role === "player" ? 0.6 : 0.4) + (t.z || 0);
    const at = renderer.project(t.x + 0.5, top, t.y + 0.5);
    if (!at) continue;
    const d = Math.hypot(at[0] - sx, at[1] - sy);
    if (d < bestDist) { bestDist = d; best = t; }
  }
  if (best) openInspector(best);
}

// A tap selects; a drag (used for turning the camera) must not also
// select whatever the drag happened to end on top of.
function setupObjectPicking(canvas) {
  let downX = 0, downY = 0, downT = 0;
  canvas.addEventListener("pointerdown", e => {
    downX = e.clientX; downY = e.clientY; downT = Date.now();
  });
  canvas.addEventListener("pointerup", e => {
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (moved > 12 || Date.now() - downT > 500) return;   // a drag, not a tap
    pickObjectAt(e.clientX, e.clientY);
  });
}

// Ring around whichever object the Inspector currently has, wherever it
// is now -- tracked every frame the same way a glyph label is.
function drawSelection() {
  const el = $("#select-highlight");
  if (!inspectTarget || !inspectTarget.alive) { el.classList.remove("on"); return; }
  const top = (inspectTarget.role === "player" ? 0.6 : 0.4) + (inspectTarget.z || 0);
  const at = renderer.project(inspectTarget.x + 0.5, top, inspectTarget.y + 0.5);
  if (!at) { el.classList.remove("on"); return; }
  el.classList.add("on");
  el.style.left = at[0] + "px";
  el.style.top = at[1] + "px";
}

function openInspector(pickedTarget) {
  if (!world) { drawerToast("not available in LIVE mode"); return; }
  const target = pickedTarget || findInspectTarget();
  if (!target) { drawerToast("touch something, or tap one in the world, first"); return; }
  inspectTarget = target;
  $("#inspect-title").textContent = "🎯 " + target.kind + (target.ghost ? " (still being placed)" : "");
  $("#inspect-color").value = target.color || "white";
  $("#inspect-shape").value = target.shape || "cube";
  const size = target.size === undefined ? 100 : target.size;
  $("#inspect-size").value = size;
  $("#inspect-size-num").value = size;
  $("#inspect-x").value = target.x;
  $("#inspect-y").value = target.y;
  $("#inspect-z").value = target.z || 0;
  $("#inspect-modal").classList.add("on");
}

function applyInspectorSize(fromSlider) {
  if (!inspectTarget || !inspectTarget.alive) return;
  const raw = fromSlider ? $("#inspect-size").value : $("#inspect-size-num").value;
  const v = Math.max(20, Math.min(300, parseFloat(raw) || 100));
  $("#inspect-size").value = v;
  $("#inspect-size-num").value = v;
  inspectTarget.size = v;
}

function applyInspectorPosition() {
  if (!inspectTarget || !inspectTarget.alive || !world) return;
  let x = Math.round(parseFloat($("#inspect-x").value));
  let y = Math.round(parseFloat($("#inspect-y").value));
  if (!Number.isFinite(x)) x = inspectTarget.x;
  if (!Number.isFinite(y)) y = inspectTarget.y;
  if (!world.inBounds(x, y)) { drawerToast("that's outside the world"); return; }
  inspectTarget.x = x;
  inspectTarget.y = y;
  const z = parseFloat($("#inspect-z").value);
  inspectTarget.z = Number.isFinite(z) ? Math.max(0, Math.min(8, z)) : 0;
}

function setupInspector() {
  const colorSelect = $("#inspect-color");
  for (const name of Object.keys(COLOR_RGB)) {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    colorSelect.appendChild(opt);
  }
  colorSelect.addEventListener("change", () => {
    if (inspectTarget && inspectTarget.alive) inspectTarget.color = colorSelect.value;
  });
  $("#inspect-shape").addEventListener("change", () => {
    // has no visible effect on a mesh-creator object (parts override
    // shape entirely in the renderer), same as it always has -- shape
    // only ever meant anything for a single-shape thing.
    if (inspectTarget && inspectTarget.alive) inspectTarget.shape = $("#inspect-shape").value;
  });
  $("#inspect-size").addEventListener("input", () => applyInspectorSize(true));
  $("#inspect-size-num").addEventListener("input", () => applyInspectorSize(false));
  for (const id of ["inspect-x", "inspect-y", "inspect-z"]) {
    $("#" + id).addEventListener("input", applyInspectorPosition);
    $("#" + id).addEventListener("change", applyInspectorPosition);
  }
  $("#inspect-delete").onclick = () => {
    if (!inspectTarget) return;
    if (!confirm('Delete this ' + inspectTarget.kind + '? This cannot be undone.')) return;
    world.remove(inspectTarget);
    inspectTarget = null;
    $("#inspect-modal").classList.remove("on");
  };
  $("#inspect-close").onclick = () => {
    $("#inspect-modal").classList.remove("on");
    inspectTarget = null;
  };
}

/* Quickbar -- a fixed row of plain bubble slots, always visible, no tab
 * to slide open first (that's what the drawer is for). Each slot is
 * still a real [data-editable] button, so it can be dragged/resized/
 * faded the same as anything else -- there's just nothing assigned to
 * any of them yet. */
function makeQuickbar(count) {
  const bar = document.createElement("div");
  bar.id = "quickbar";
  for (let i = 1; i <= count; i++) {
    const el = document.createElement("div");
    el.className = "bubble";
    el.textContent = String(i);
    el.title = "quickbar slot " + i;
    el.onclick = () => { if (!editingButtons) drawerToast("slot " + i + " -- nothing set yet"); };
    registerEditable(el, "quickbar:" + i, "quickbar slot " + i);
    bar.appendChild(el);
  }
  document.body.appendChild(bar);
}

function makeDrawer({edge = "left", buttons = []}) {
  const root = document.createElement("div");
  root.className = "drawer";
  root.dataset.edge = edge;

  const tab = document.createElement("div");
  tab.className = "tab";
  tab.innerHTML = '<span>&#8250;</span>';
  root.appendChild(tab);

  const bubbles = document.createElement("div");
  bubbles.className = "bubbles";
  root.appendChild(bubbles);

  const nextUid = () => "bub" + Math.random().toString(36).slice(2, 9);
  const list = buttons.slice();
  for (const b of list) b.__uid = b.__uid || nextUid();
  let selected = list.length ? 0 : null;
  // Armed by ×: the next bubble you tap is the one that gets removed,
  // instead of whatever happened to be selected already. A bubble marked
  // `locked: true` in its config (the built-ins this drawer ships with,
  // e.g.) refuses to be picked that way at all.
  let removing = false;

  const bubbleEl = (icon, title, extraClass) => {
    const el = document.createElement("div");
    el.className = "bubble" + (extraClass ? " " + extraClass : "");
    if (title) el.title = title;
    el.textContent = icon;
    return el;
  };

  function render() {
    bubbles.innerHTML = "";
    list.forEach((b, i) => {
      const el = bubbleEl(b.icon || "?", b.label || "");
      el.classList.toggle("selected", i === selected);
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (editingButtons) return;   // the button editor owns taps for now
        if (removing) {
          if (b.locked) {
            el.classList.add("shake");
            setTimeout(() => el.classList.remove("shake"), 320);
            return;   // stays armed -- this one just is not removable
          }
          list.splice(i, 1);
          if (selected === i) selected = null;
          else if (selected !== null && selected > i) selected -= 1;
          removing = false;
          render();
          return;
        }
        selected = i;
        render();
        if (b.onTap) b.onTap();
      });
      // Registered on every render, not just once -- the drawer rebuilds
      // this element from scratch each time, and registerEditable both
      // points the editor at the new one and re-applies its saved size/
      // position/fade, so customizing a bubble survives its own redraws.
      registerEditable(el, "drawer:" + edge + ":" + b.__uid, b.label || b.icon);
      bubbles.appendChild(el);
    });

    const add = bubbleEl("+", "add a button before the selected one", "control add");
    add.addEventListener("click", (e) => {
      e.stopPropagation();
      if (editingButtons) return;
      removing = false;   // adding cancels an armed removal
      const icon = prompt("icon for the new button", "★");
      if (icon === null) { render(); return; }
      const at = selected === null ? list.length : selected;
      const fresh = {icon: icon || "•", label: "new", __uid: nextUid(),
                     onTap: () => drawerToast(icon || "•")};
      list.splice(at, 0, fresh);
      selected = at;
      render();
    });
    registerEditable(add, "drawer:" + edge + ":add", "add a button (drawer control)");
    bubbles.appendChild(add);

    const remove = bubbleEl("×",
      removing ? "tap the button to remove (tap × again to cancel)" : "remove a button",
      "control remove");
    remove.classList.toggle("armed", removing);
    remove.addEventListener("click", (e) => {
      e.stopPropagation();
      if (editingButtons) return;
      removing = !removing;
      render();
    });
    registerEditable(remove, "drawer:" + edge + ":remove", "remove a button (drawer control)");
    bubbles.appendChild(remove);
  }
  render();

  let drawerOpen = false;
  const setOpen = (v) => {
    drawerOpen = v;
    root.classList.toggle("open", drawerOpen);
    if (!v && removing) { removing = false; render(); }   // closing cancels it
  };
  tab.addEventListener("click", (e) => {
    e.stopPropagation();
    setOpen(!drawerOpen);
  });
  document.addEventListener("click", () => { if (drawerOpen) setOpen(false); });

  document.body.appendChild(root);
  return {root, open: () => setOpen(true), close: () => setOpen(false)};
}

function fail(heading, detail) {
  $("#veil-h").textContent = heading;
  $("#veil-p").textContent = detail;
  $("#veil").classList.add("on");
}

/* Say what went wrong, on the screen.
 *
 * A phone browser has no console you can open. Chrome on Android will not show
 * you a stack trace however hard you tap, so an uncaught error here would be a
 * black rectangle and no way to find out why -- which is useless to report and
 * useless to fix. Anything that escapes gets written on the page instead, in
 * words that can be read out or photographed. */
function reportCrash(what, err) {
  const where = err && err.stack ? String(err.stack).split("\n")[0] : "";
  fail("Spark 3D hit a problem",
       what + ": " + ((err && err.message) || err || "unknown") +
       (where ? "\n\n" + where : ""));
  $("#veil-b").textContent = "reload";
  $("#veil-b").onclick = () => location.reload();
}

window.addEventListener("error", e => reportCrash("error", e.error || e.message));
window.addEventListener("unhandledrejection",
                        e => reportCrash("unfinished request", e.reason));

(async function boot() {
  try {
    renderer = new Renderer($("#gl"));
  } catch (err) {
    fail("This browser has no WebGL",
         "Spark 3D needs WebGL, which this browser did not give us. The flat " +
         "editor still works: go back and press play there. (" + err.message + ")");
    $("#veil-b").onclick = () => location.href = "./";
    return;
  }

  const [found, where] = await findProject();
  project = found;
  lastSaveName = project.name || null;
  // Already the file this world came from -- overwriting it via plain
  // "save" is expected, not a collision to ask about.
  if (project.name) confirmedNames.add(project.name);
  $("#title").textContent = project.name || "Spark 3D";

  const snap = await probeLive();
  if (snap) startLive(snap); else startLocal();

  bindCamera($("#gl"));
  setupObjectPicking($("#gl"));
  bindControls();
  makeDrawer({edge: "left", buttons: [
    // press once for a see-through preview where you stand, press again
    // (the same bubble, or the "a" key) to confirm and place it for real.
    // locked: it ships with this drawer, not something you added, so ×
    // refuses to pick it -- add/remove is for your own bubbles only.
    {icon: "▦", label: "add a 3D object", onTap: () => pressed.add("a"), locked: true},
    // walking (grounded, w/s fly buttons do nothing) <-> flying (w/s
    // change altitude). Same key ("d") as pressing it on a keyboard.
    {icon: "🕊", label: "toggle walk/fly mode", onTap: () => pressed.add("d"), locked: true},
    // "remove" is not a real keyboard key -- pressed is just a set of
    // strings, and nothing requires those strings to be real keys. Any
    // WHEN row can watch for one that only a UI button ever sends.
    {icon: "🗑", label: "remove the object I'm touching", onTap: () => pressed.add("remove"), locked: true},
    {icon: "🎨", label: "build: pick what to place, or open the Mesh Creator",
     onTap: () => openPalette(), locked: true},
    // whatever you're touching, or your pending ghost if you have one --
    // colour, resize, and relocate it directly, live.
    {icon: "🎯", label: "inspect: colour, resize, relocate", onTap: () => openInspector(), locked: true},
  ]});
  setupBackpack();
  setupProperties();
  setupMeshCreator();
  setupPalette();
  setupInspector();
  setupCompass();
  makeQuickbar(7);

  // Turning the phone swaps which region is which shape, and a camera framed
  // for one is wrong for the other. Only a flip re-fits it, though: Chrome
  // fires resize every time its address bar slides away, and re-framing on
  // those would yank the view back out from under anyone who had zoomed in.
  let wasWide = null;
  const onResize = () => {
    renderer.resize();
    const wide = $("#gl").clientWidth >= $("#gl").clientHeight;
    if (wasWide !== null && wide !== wasWide) renderer.frameBoard();
    wasWide = wide;
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  onResize();
  pollTimer = setInterval(poll, 130);
  requestAnimationFrame(frame);

  if (where === "the built-in demo")
    $("#say").textContent = "no game found - showing the built-in demo";
})();
</script>
</body>
</html>
